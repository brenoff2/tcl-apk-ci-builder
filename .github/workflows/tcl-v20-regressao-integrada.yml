name: TCL v2.0 controle unico + complemento TV 1.3 - regressao

on:
  push:
    branches: ['fix/tcl-v20-responsive-teclado-tema']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcl-v20-integrated
  cancel-in-progress: true

jobs:
  android-phone:
    name: Celular - responsivo teclado tema identidade
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Recuperar upstream Apache-2.0
        run: |
          git clone --depth 1 https://github.com/harimoradiya/androidtvremote.git source
          test "$(git -C source rev-parse HEAD)" = "16c68f0bb9d23f929ee8240f105fdb9000262d85"
      - name: Preparar app unico v2.0 com o ID original
        run: |
          TCL_RESCUE_STABLE=1 TCL_APPROVED_UI=1 TCL_RELEASE_SINGLE_APP=1 python3 scripts/prepare_tcl.py
          grep -q 'applicationId = "com.tclremote.livre"' source/app/build.gradle.kts
          ! grep -q 'applicationId = "com.tclremote.livre.preview"' source/app/build.gradle.kts
      - name: Testar regressao dos cinco bugs
        run: |
          TCL_APPROVED_UI=1 TCL_RELEASE_SINGLE_APP=1 python3 -m unittest discover -s scripts/tests -p 'test_rescue_contract.py' -v
          TCL_APPROVED_UI=1 TCL_RELEASE_SINGLE_APP=1 python3 -m unittest discover -s scripts/tests -p 'test_approved_visual_contract.py' -v
          bash -n scripts/sign_update_apk.sh
      - name: Compilar app completo Android
        run: |
          cd source
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Auditar identificador e gerar BASE DE ASSINATURA (NAO DISTRIBUIR)
        run: |
          set -euo pipefail
          mkdir -p output-phone
          APK=source/app/build/outputs/apk/debug/app-debug.apk
          SDK="$ANDROID_HOME/build-tools/36.0.0"
          "$SDK/apksigner" verify --verbose --print-certs "$APK" > output-phone/assinatura_debug.txt
          "$SDK/aapt" dump badging "$APK" > output-phone/identidade.txt
          grep -q "name='com.tclremote.livre' versionCode='20'" output-phone/identidade.txt
          sha256sum "$APK" > output-phone/sha256.txt
          cp "$APK" output-phone/BASE_APP_2_0_REASSINAR_NAO_INSTALAR.apk
          cat > output-phone/NAO_INSTALAR.txt <<'TXT'
          Esse APK tem assinatura temporaria de DEBUG. NAO INSTALAR como atualizacao.
          O aparelho 1.7 usa certificado 49de7c9a... (chave original nao recuperada).
          Para usar como app unico, e preciso assinar com chave persistente,
          planejar backup e migracao manual da versao instalada.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: TCL_PHONE_20_BASE_DEBUG_NAO_INSTALAR
          path: output-phone/
          retention-days: 14
          if-no-files-found: error

  android-tv:
    name: TV - apps reais fones sem acessibilidade
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Recuperar upstream MIT e montar complemento
        run: |
          git clone --depth 1 https://github.com/fezdk/bluetooth-quick-connect.git tv-source
          test "$(git -C tv-source rev-parse HEAD)" = "508b5f148e1945911085f1789051c59d76c0278b"
          python3 scripts/prepare_companion_safe.py
      - name: Testar API Bluetooth e ausencia de Acessibilidade
        run: python3 -m unittest discover -s scripts/tests -p 'test_safe_tv_companion.py' -v
      - name: Compilar Android TV 1.3
        run: |
          cd tv-source
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Auditar manifesto real, sem AccessibilityService
        run: |
          set -euo pipefail
          mkdir -p output-tv
          APK=tv-source/app/build/outputs/apk/debug/app-debug.apk
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK/apksigner" verify --verbose --print-certs "$APK" > output-tv/assinatura_debug.txt
          "$SDK/aapt" dump badging "$APK" > output-tv/identidade.txt
          "$SDK/aapt" dump permissions "$APK" > output-tv/permissoes.txt
          "$SDK/aapt" dump xmltree "$APK" AndroidManifest.xml > output-tv/manifesto.txt
          grep -q "name='com.tclremote.tvcompanion' versionCode='4'" output-tv/identidade.txt
          grep -q 'BLUETOOTH_CONNECT' output-tv/permissoes.txt
          if grep -Ei 'BIND_ACCESSIBILITY_SERVICE|AccessibilityService|QUERY_ALL_PACKAGES|SYSTEM_ALERT_WINDOW|android.permission.BLUETOOTH_SCAN' output-tv/permissoes.txt output-tv/manifesto.txt; then
            echo 'BLOQUEADO: permissao sensivel inesperada'
            exit 1
          fi
          sha256sum "$APK" > output-tv/sha256.txt
          cp "$APK" output-tv/BASE_TV_1_3_REASSINAR_NAO_INSTALAR.apk
          cat > output-tv/NAO_INSTALAR.txt <<'TXT'
          O APK da TV 1.3 tem assinatura temporaria do runner de CI.
          Nao atualiza a TV 1.2. A liberacao requer certificado persistente
          e migracao documentada. O Play Protect ainda requer teste fisico.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: TCL_TV_13_BASE_DEBUG_NAO_INSTALAR
          path: output-tv/
          retention-days: 14
          if-no-files-found: error
