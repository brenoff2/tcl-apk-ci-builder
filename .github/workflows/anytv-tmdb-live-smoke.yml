name: AnyTV TMDB live catalog smoke (no paid API key in CI)
on:
  push:
    branches: ['feat/anytv-p0-device-proof-verifier-20261020']
    paths: ['.github/workflows/anytv-tmdb-live-smoke.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Live TMDB film, TV and genre search via official Cloudflare Worker
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          base = "https://anytv-link-resolver-pilot.brenoff.workers.dev/v1/catalog/"
          for route, query in (
              ("search/movie", {"language":"pt-BR","query":"Titanic"}),
              ("search/tv", {"language":"pt-BR","query":"Breaking Bad"}),
              ("discover/movie", {"language":"pt-BR","with_genres":"28","page":"1"}),
              ("discover/movie", {"language":"pt-BR","with_genres":"28","page":"2"}),
              ("discover/movie", {"language":"pt-BR","with_genres":"28","page":"1","sort_by":"vote_average.desc"}),
              ("discover/movie", {"language":"pt-BR","with_genres":"28","page":"2","sort_by":"primary_release_date.desc"}),
              ("discover/tv", {"language":"pt-BR","with_genres":"18","page":"1","sort_by":"first_air_date.desc"}),
              ("discover/tv", {"language":"pt-BR","with_genres":"18","page":"2","sort_by":"name.asc"}),
          ):
              request = urllib.request.Request(base + route + "?" + urllib.parse.urlencode(query),
                  headers={"Accept":"application/json", "User-Agent":"AnyTV/2.9.22 smoke"})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      data=json.load(response)
                      assert response.status == 200, response.status
                      assert isinstance(data.get("results"),list) and data["results"], route
                      print("ANYTV_TMDB_LIVE_OK",route,"results",len(data["results"]),
                            "total_pages",data.get("total_pages"))
              except urllib.error.HTTPError as err:
                  print("ANYTV_TMDB_LIVE_FAIL",route,err.code,
                        err.read(150).decode("utf-8",errors="replace"))
                  raise
          # Invalid sort expressions must be rejected before reaching TMDB.
          invalid = urllib.request.Request(base +
              "discover/movie?language=pt-BR&with_genres=28&sort_by=first_air_date.desc",
              headers={"Accept":"application/json", "User-Agent":"AnyTV/2.9.22 smoke"})
          try:
              urllib.request.urlopen(invalid, timeout=15)
              raise AssertionError("unsupported sort unexpectedly accepted")
          except urllib.error.HTTPError as exc:
              # Cloudflare security edge can reject malformed upstream sort
              # before the Worker with 403; offline contract verifies exact 400.
              assert exc.code in (400, 403), exc.code
              print("ANYTV_TMDB_SORT_VALIDATION_OK", exc.code)
          PY
