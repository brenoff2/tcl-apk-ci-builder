name: Publish AnyTV 2.9.10 cert2026 OTA (single GitHub Actions pipeline)
on:
  push:
    branches: ['feat/tcl-v22-updates-back-bluetooth']
    paths: ['.github/workflows/publish-anytv-cert2026-update-2910.yml']
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Successful 2.9.10 candidate workflow run id'
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: anytv-cert2026-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVERY_HEX: ${{ secrets.ANYTV_RECOVERY_SECRET_2026 || secrets.ANYTV_SIGNING_RECOVERY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tcl-v22-updates-back-bluetooth
          fetch-depth: 0
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Verify existing encrypted cert2026 signing backup
        shell: bash
        run: |
          set -euo pipefail
          test -s signing-recovery/ANYTV_SIGNING_BACKUP_2026_ENCRYPTED.bin
          if [ -z "${RECOVERY_HEX:-}" ]; then
            echo "::error::Encrypted original signing backup exists in GitHub, but no matching recovery secret is available as a GitHub Actions secret."
            exit 1
          fi
          echo 'ANYTV_ORIGINAL_ENCRYPTED_SIGNER_FOUND'
      - name: Verify candidate CI identity and download exact artifact
        shell: bash
        env:
          RUN_ID: ${{ inputs.candidate_run_id || '39774708705' }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/brenoff2/tcl-apk-ci-builder/actions/runs/$RUN_ID" --jq '.conclusion + " " + .head_branch + " " + .path' |
            grep -Fx 'success feat/anytv-p0-device-proof-verifier-20261020 .github/workflows/anytv-2910-candidate.yml'
          mkdir -p incoming signed
          gh run download "$RUN_ID" --name anytv-discovery-v3-2910-unsigned-audit --dir incoming
          test -s incoming/AnyTV_2_9_10_RELEASE_UNSIGNED.apk
          sha256sum incoming/AnyTV_2_9_10_RELEASE_UNSIGNED.apk
      - name: Recover original phone cert2026 signer privately and sign
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -m pip install -q 'cryptography>=43,<47'
          mkdir -p signing-private
          trap 'rm -rf signing-private' EXIT
          python3 - <<'PY'
          import io, os, pathlib, zipfile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          blob=pathlib.Path('signing-recovery/ANYTV_SIGNING_BACKUP_2026_ENCRYPTED.bin').read_bytes()
          assert blob[:9] == b'ANYTVAES1', 'Encrypted signer format mismatch'
          key=bytes.fromhex(os.environ['RECOVERY_HEX'].strip())
          assert len(key)==32, 'Recovery key length invalid'
          raw=AESGCM(key).decrypt(blob[9:21],blob[21:],None)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              names={'anytv-phone-migration.p12','phone.password'}
              assert names.issubset(set(z.namelist())), 'Phone signing backup entries missing'
              for name in names:
                  pathlib.Path('signing-private',name).write_bytes(z.read(name))
          print('Encrypted original phone signing backup recovered in temporary private directory')
          PY
          export PHONE_PASSWORD
          PHONE_PASSWORD="$(cat signing-private/phone.password)"
          echo "::add-mask::$PHONE_PASSWORD"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" sign --ks signing-private/anytv-phone-migration.p12 --ks-type PKCS12 \
            --ks-pass env:PHONE_PASSWORD --key-pass env:PHONE_PASSWORD \
            --out signed/AnyTV_2_9_10_SIGNED_CERT2026.apk incoming/AnyTV_2_9_10_RELEASE_UNSIGNED.apk
          "$BT/apksigner" verify --verbose --print-certs signed/AnyTV_2_9_10_SIGNED_CERT2026.apk > signed/certificate-audit.txt
          grep -q '^Verifies$' signed/certificate-audit.txt
          grep -qi '2f14e43f7653a75f878c4d59a4a8ad462ade17c52bde23e802c8c6ed43ade95f' signed/certificate-audit.txt
          "$BT/aapt" dump badging signed/AnyTV_2_9_10_SIGNED_CERT2026.apk | grep -q "name='com.tclremote.livre' versionCode='39' versionName='2.9.10-AnyTV'"
          "$BT/zipalign" -c 4 signed/AnyTV_2_9_10_SIGNED_CERT2026.apk
          sha256sum signed/AnyTV_2_9_10_SIGNED_CERT2026.apk
      - name: Confirm installed-compatible upgrade and publish phone channel only
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging updates/android/cert2026/current.apk | grep -Eq "name='com.tclremote.livre' versionCode='(37|38)'"
          cp signed/AnyTV_2_9_10_SIGNED_CERT2026.apk updates/android/cert2026/current.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f updates/android/cert2026/current.apk
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'release(anytv): publish phone 2.9.10 cert2026 OTA [skip ci]'
            git push origin HEAD:feat/tcl-v22-updates-back-bluetooth
          fi
      - name: Verify remote OTA bytes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL --retry 2 "https://raw.githubusercontent.com/brenoff2/tcl-apk-ci-builder/feat/tcl-v22-updates-back-bluetooth/updates/android/cert2026/current.apk?attempt=$attempt" -o published.apk || true
            if test -s published.apk && cmp -s published.apk signed/AnyTV_2_9_10_SIGNED_CERT2026.apk; then
              echo 'ANYTV_2910_CERT2026_OTA_PUBLISHED_READBACK_OK'
              exit 0
            fi
            sleep 10
          done
          echo 'OTA readback mismatch: NOT PUBLISHED' >&2
          exit 1
