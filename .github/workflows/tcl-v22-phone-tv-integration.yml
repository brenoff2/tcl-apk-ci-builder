name: AnyTV Android 2.9.2 Streaming fallback compatibility

on:
  push:
    branches: ['feat/tcl-v22-updates-back-bluetooth']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcl-v22-integrated
  cancel-in-progress: true

jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Clonar fonte Android TV Remote 2 Apache-2.0 fixada
        run: |
          git clone --depth 1 https://github.com/harimoradiya/androidtvremote.git source
          test "$(git -C source rev-parse HEAD)" = "16c68f0bb9d23f929ee8240f105fdb9000262d85"
      - name: Preparar app e aplicar versoes v2.0 -> v2.1 -> v2.2
        run: |
          TCL_RESCUE_STABLE=1 TCL_APPROVED_UI=1 TCL_RELEASE_SINGLE_APP=1 python3 scripts/prepare_tcl.py
          python3 scripts/apply_tcl_v21.py
          python3 scripts/apply_tcl_v22.py
          python3 scripts/apply_tcl_ptbr_cleanup.py
          python3 scripts/apply_tcl_i18n.py
          python3 scripts/apply_tcl_tv_brand.py
          python3 scripts/apply_tcl_sticky_controls.py
          python3 scripts/apply_anytv_brand.py
          python3 -c 'import pathlib, xml.etree.ElementTree as ET; files=list(pathlib.Path("source/app/src/main/res").glob("values*/tcl_localization.xml")); assert len(files)==16, len(files); [ET.parse(p) for p in files]; print("TCL_I18N_XML_VALID",len(files))'
      - name: Validar regressao e atualizacao segura
        env:
          TCL_APPROVED_UI: '1'
          TCL_RELEASE_SINGLE_APP: '1'
          TCL_V21: '1'
          TCL_V22: '1'
          TCL_V23: '1'
          TCL_V24: '1'
          TCL_V25: '1'
          TCL_V26: '1'
          TCL_V27: '1'
          TCL_V28: '1'
          TCL_V29: '1'
          TCL_V30: '1'
          TCL_V31: '1'
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_rescue_contract.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_approved_visual_contract.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_tcl_v21_contract.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_tcl_v22_contract.py' -k PhoneUpdatesAndBack -v
      - name: Validar telas de streaming reais
        run: python3 -m unittest discover -s scripts/tests -p 'test_streaming_screens_contract.py' -v
      - name: Compilar release sem R8 agressivo
        run: |
          cd source
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Testar serializacao IME Remote v2 contra mensagens de referencia
        run: |
          cd source
          ./gradlew :app:testDebugUnitTest --tests 'com.hari.androidtvremote.androidLib.remote.RemoteImeWireTest' --no-daemon --stacktrace
      - name: Auditar APK e guardar release nao assinado
        run: |
          set -euo pipefail
          mkdir -p output
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=source/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/aapt" dump badging "$APK" > output/identidade.txt
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml > output/manifesto.txt
          grep -q "name='com.tclremote.livre' versionCode='31'" output/identidade.txt
          ! grep -q 'com.tclremote.livre.preview' output/identidade.txt
          "$BT/zipalign" -f 4 "$APK" output/AnyTV_2_9_2_RELEASE_UNSIGNED.apk
          "$BT/zipalign" -c 4 output/AnyTV_2_9_2_RELEASE_UNSIGNED.apk
          sha256sum output/AnyTV_2_9_2_RELEASE_UNSIGNED.apk > output/SHA256.txt
          echo 'NAO INSTALAR. Assinar com a chave permanente DF729774... da v2.0 e v2.1' > output/LEIA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ANYTV_PHONE_2_9_2_UNSIGNED_TO_SIGN
          path: output/
          retention-days: 30
          if-no-files-found: error

  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Clonar fonte MIT fixada e preparar TV 1.6
        run: |
          git clone --depth 1 https://github.com/fezdk/bluetooth-quick-connect.git tv-source
          test "$(git -C tv-source rev-parse HEAD)" = "508b5f148e1945911085f1789051c59d76c0278b"
          python3 scripts/prepare_companion_safe.py
      - name: Auditar fonte e permissoes
        env:
          TCL_TV_V14: '1'
          TCL_TV_V15: '1'
          TCL_TV_V16: '1'
          TCL_TV_V17: '1'
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_safe_tv_companion.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_tcl_v22_contract.py' -k TvUpdateAndBluetooth -v
      - name: Compilar release TV
        run: |
          cd tv-source
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verificar pacote e permissoes (sem Acessibilidade)
        run: |
          set -euo pipefail
          mkdir -p output
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=tv-source/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/aapt" dump badging "$APK" > output/identidade.txt
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml > output/manifesto.txt
          "$BT/aapt" dump permissions "$APK" > output/permissoes.txt
          grep -q "name='com.tclremote.tvcompanion' versionCode='8'" output/identidade.txt
          if grep -Ei 'BIND_ACCESSIBILITY_SERVICE|AccessibilityService|QUERY_ALL_PACKAGES|SYSTEM_ALERT_WINDOW|android.permission.BLUETOOTH_SCAN' output/permissoes.txt output/manifesto.txt; then
            echo 'PERMISSAO SENSIVEL NA TV'; exit 1
          fi
          "$BT/zipalign" -f 4 "$APK" output/AnyTV_TV_1_7_RELEASE_UNSIGNED.apk
          "$BT/zipalign" -c 4 output/AnyTV_TV_1_7_RELEASE_UNSIGNED.apk
          sha256sum output/AnyTV_TV_1_7_RELEASE_UNSIGNED.apk > output/SHA256.txt
          echo 'NAO INSTALAR. Gerar versoes assinadas com ambos certificados TV 1.3.' > output/LEIA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ANYTV_TV_1_7_UNSIGNED_DUAS_ASSINATURAS
          path: output/
          retention-days: 30
          if-no-files-found: error

  contracts:
    needs: [phone, tv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: ANYTV_PHONE_2_9_2_UNSIGNED_TO_SIGN, path: phone-artifact}
      - uses: actions/download-artifact@v4
        with: {name: ANYTV_TV_1_7_UNSIGNED_DUAS_ASSINATURAS, path: tv-artifact}
      - run: |
          test -s phone-artifact/AnyTV_2_9_2_RELEASE_UNSIGNED.apk
          test -s tv-artifact/AnyTV_TV_1_7_RELEASE_UNSIGNED.apk
          echo 'Both release builds ready for locally verified certificate-compatible signing'
