name: Publish signed AnyTV Android 2.7
on:
  push:
    branches: ['feat/tcl-v22-updates-back-bluetooth']
    paths: ['.github/workflows/publish-anytv-27.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tcl-v22-updates-back-bluetooth
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Verify signed AnyTV 2.7 APK
        env:
          SIGNED_SOURCE: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-6834-820e-a468-92ed61604ab7/raw?se=2026-10-15T00%3A59%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=ca56406a-0491-5474-9328-5ba421154ddc&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T05%3A09%3A06Z&ske=2026-10-15T05%3A09%3A06Z&sks=b&skv=2026-02-06&sig=FA4MOEwA8yStjzPDJPRggQZzYHciksGFAPMO6c1t4q8%3D'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 "$SIGNED_SOURCE" -o output/AnyTV-2.7.apk
          echo '66f76ba5f486c9d91d954c75b7d27358399e7a18e775ef9e3546e07286d888cc  output/AnyTV-2.7.apk' | sha256sum -c
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/aapt" dump badging output/AnyTV-2.7.apk | grep -q "name='com.tclremote.livre' versionCode='27' versionName='2.7-AnyTV'"
          "$bt/apksigner" verify --verbose --print-certs output/AnyTV-2.7.apk > output/cert.txt
          grep -qi 'df72977485e8e5243048a7f1e8dff9fedcf2295161c4daae3834b6a16cd4e4c8' output/cert.txt
          "$bt/zipalign" -c 4 output/AnyTV-2.7.apk
      - name: Publish current APK and immutable historical archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p updates/android
          cp output/AnyTV-2.7.apk updates/android/current.apk
          cp output/AnyTV-2.7.apk updates/android/AnyTV-v2.7.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f updates/android/current.apk updates/android/AnyTV-v2.7.apk
          if ! git diff --cached --quiet; then
            git commit -m "release(android): signed AnyTV 2.7 input-protocol update [skip ci]"
            git push
          fi
      - name: Publish GitHub Release for legacy updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cp output/AnyTV-2.7.apk Controle_TCL_Livre_v2.7.apk
          if gh release view tcl-phone-v2.7 >/dev/null 2>&1; then
            gh release upload tcl-phone-v2.7 Controle_TCL_Livre_v2.7.apk --clobber
          else
            gh release create tcl-phone-v2.7 Controle_TCL_Livre_v2.7.apk --target feat/tcl-v22-updates-back-bluetooth --title "AnyTV Android 2.7" --notes "IME Remote v2: synced remote counters, one complete text batch per send, improved input field guidance."
          fi
      - name: Verify release is identical to tested APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/release
          gh release download tcl-phone-v2.7 -p Controle_TCL_Livre_v2.7.apk -D output/release
          echo '66f76ba5f486c9d91d954c75b7d27358399e7a18e775ef9e3546e07286d888cc  output/release/Controle_TCL_Livre_v2.7.apk' | sha256sum -c
          cmp output/AnyTV-2.7.apk output/release/Controle_TCL_Livre_v2.7.apk
          cmp output/AnyTV-2.7.apk updates/android/current.apk
          echo ANYTV_27_PUBLISHED_AND_VERIFIED
