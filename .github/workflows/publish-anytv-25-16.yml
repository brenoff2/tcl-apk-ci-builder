name: Verify published AnyTV 2.5 and Connect 1.6
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tcl-v22-updates-back-bluetooth
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Verify published APK packages versions signatures and release hashes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/36.0.0"
          phone=updates/android/current.apk
          tv=updates/tv/cert8b2b/current.apk
          echo '98a8628e7df3210a9a33ac5533630099c3a0c16d179655e548c2ed58e691c9da  updates/android/current.apk' | sha256sum -c
          echo 'fbb216082f23278cdccbe0625416376b69143a080010c097d4601cd9322fe86b  updates/tv/cert8b2b/current.apk' | sha256sum -c
          "$bt/aapt" dump badging "$phone" | grep -q "name='com.tclremote.livre' versionCode='25' versionName='2.5-AnyTV'"
          "$bt/aapt" dump badging "$tv" | grep -q "name='com.tclremote.tvcompanion' versionCode='7' versionName='1.6-AnyTV'"
          "$bt/apksigner" verify --verbose --print-certs "$phone" | grep -qi 'df72977485e8e5243048a7f1e8dff9fedcf2295161c4daae3834b6a16cd4e4c8'
          "$bt/apksigner" verify --verbose --print-certs "$tv" | grep -qi '8b2b0c6f2a7a668f9aae829be811241dc70c3697af2b3e6c71e1a1767a5d83da'
          cmp "$phone" updates/android/AnyTV-v2.5.apk
          cmp "$tv" updates/tv/cert8b2b/AnyTV-Connect-v1.6.apk
          mkdir -p staging/android staging/tv
          gh release download tcl-phone-v2.5 -p Controle_TCL_Livre_v2.5.apk -D staging/android
          gh release download tv-complemento-v1.6 -p Controle_TCL_TV_v1.6_cert8b2b.apk -D staging/tv
          cmp "$phone" staging/android/Controle_TCL_Livre_v2.5.apk
          cmp "$tv" staging/tv/Controle_TCL_TV_v1.6_cert8b2b.apk
          echo 'ANYTV_PUBLISHED_BINARIES_VERIFIED'
