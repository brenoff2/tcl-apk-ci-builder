name: Publish AnyTV 2.9.1 signed update
on:
  push:
    branches: ['feat/tcl-v22-updates-back-bluetooth']
    paths:
      - '.github/workflows/publish-anytv-291.yml'
      - '.github/anytv-291-parts/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Check stable base and approved successful build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/runs/38688799424 --jq .conclusion)" = success
          if gh release view tcl-phone-v2.9.1 >/dev/null 2>&1; then
            echo 'AnyTV 2.9.1 is already published; refusing replacement'
            exit 1
          fi
          echo '67e100180ecc9d6a56d8cb1a68f15df1d1d3d7d3f7d91649b09c0539f289a806  updates/android/current.apk' | sha256sum -c -
          cmp updates/android/current.apk updates/android/AnyTV-v2.9.apk
          command -v zstd
      - name: Rebuild exact pre-signed APK from verified binary patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cat .github/anytv-291-parts/part_*.bin > output/patch.zst
          echo '296e98a0afd2bd17a9446a19996a8e021fda307fbad51177690e962cf19ed24d  output/patch.zst' | sha256sum -c -
          zstd -d -f --patch-from=updates/android/current.apk output/patch.zst -o output/AnyTV-v2.9.1.apk
          echo 'beb9eb71098c0cb0a1101a35b1000339054a2d2a8f17f6ba787bf5e297700413  output/AnyTV-v2.9.1.apk' | sha256sum -c -
      - name: Validate package, version, signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging output/AnyTV-v2.9.1.apk | grep -q "name='com.tclremote.livre' versionCode='30' versionName='2.9.1-AnyTV'"
          "$BT/apksigner" verify --verbose --print-certs output/AnyTV-v2.9.1.apk > output/cert.txt
          grep -qi 'df72977485e8e5243048a7f1e8dff9fedcf2295161c4daae3834b6a16cd4e4c8' output/cert.txt
          "$BT/zipalign" -c 4 output/AnyTV-v2.9.1.apk
      - name: Publish the new current.apk and historic version
        shell: bash
        run: |
          set -euo pipefail
          cp output/AnyTV-v2.9.1.apk updates/android/AnyTV-v2.9.1.apk
          cp output/AnyTV-v2.9.1.apk updates/android/current.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f updates/android/current.apk updates/android/AnyTV-v2.9.1.apk
          git diff --cached --quiet && { echo 'No changes to publish'; exit 1; }
          git commit -m "release(android): signed AnyTV 2.9.1 is now current [skip ci]"
          git push origin HEAD:feat/tcl-v22-updates-back-bluetooth
      - name: Create downloadable signed 2.9.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp output/AnyTV-v2.9.1.apk Controle_TCL_Livre_v2.9.1.apk
          gh release create tcl-phone-v2.9.1 Controle_TCL_Livre_v2.9.1.apk --target feat/tcl-v22-updates-back-bluetooth --title "AnyTV Android 2.9.1" --notes "Compactação da tela Streaming: cabeçalho, botão discreto para abrir serviço na TCL, campo de pesquisa compacto, mais espaço para os cartazes. Certificado original preservado. O complemento da TV não foi alterado."
      - name: Verify official release and update channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/release
          gh release download tcl-phone-v2.9.1 -p Controle_TCL_Livre_v2.9.1.apk -D output/release
          echo 'beb9eb71098c0cb0a1101a35b1000339054a2d2a8f17f6ba787bf5e297700413  output/release/Controle_TCL_Livre_v2.9.1.apk' | sha256sum -c -
          echo 'beb9eb71098c0cb0a1101a35b1000339054a2d2a8f17f6ba787bf5e297700413  updates/android/current.apk' | sha256sum -c -
          cmp output/AnyTV-v2.9.1.apk updates/android/current.apk
          cmp output/AnyTV-v2.9.1.apk updates/android/AnyTV-v2.9.1.apk
          echo ANYTV_291_AUTO_UPDATE_PUBLISHED_VERIFIED
