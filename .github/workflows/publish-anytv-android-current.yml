name: Publish signed AnyTV Android current APK
on:
  push:
    branches: ['feat/tcl-v22-updates-back-bluetooth']
    paths: ['.github/workflows/publish-anytv-android-current.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: 'feat/tcl-v22-updates-back-bluetooth'}
      - name: Download existing verified signed APK
        shell: bash
        env:
          ONE_TIME_APK_SOURCE: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-394c-820e-a061-fc862db1d1df/raw?se=2026-10-14T06%3A37%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=b2d08059-b51c-5a9b-ba7f-9262f3f3af2e&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T04%3A57%3A52Z&ske=2026-10-15T04%3A57%3A52Z&sks=b&skv=2026-02-06&sig=nATj6X8igrYQwG4y%2BpozY5SxOWNoZsKOMhONUv8Fzl8%3D'
        run: |
          set -euo pipefail
          mkdir -p updates/android
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 "$ONE_TIME_APK_SOURCE" -o updates/android/current.apk
          echo '5a5edee82904980742eac1598a267f3856981b8adaada4c978cb5001ae086e40  updates/android/current.apk' | sha256sum --check
          cp updates/android/current.apk updates/android/AnyTV-v2.4.apk
      - name: Publish current.apk and immutable historical APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f updates/android/current.apk updates/android/AnyTV-v2.4.apk
          if ! git diff --cached --quiet; then
            git commit -m "release(android): publish signed AnyTV 2.4 current.apk [skip ci]"
            git push
          fi
      - name: Publish GitHub Release for the updater installed in version 2.2
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp updates/android/current.apk Controle_TCL_Livre_v2.4.apk
          if gh release view tcl-phone-v2.4 >/dev/null 2>&1; then
            gh release upload tcl-phone-v2.4 Controle_TCL_Livre_v2.4.apk --clobber
          else
            gh release create tcl-phone-v2.4 Controle_TCL_Livre_v2.4.apk --target feat/tcl-v22-updates-back-bluetooth --title "AnyTV 2.4 Android" --notes "APK Android assinado com o mesmo certificado da versão 2.2. Compatível com atualização sem desinstalar."
          fi
