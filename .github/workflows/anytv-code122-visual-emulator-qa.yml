name: AnyTV code122 isolated real Compose emulator screenshot QA (NO OTA)
on:
  push:
    branches: ['feat/anytv-p0-device-proof-verifier-20261020']
    paths:
      - '.github/workflows/anytv-code122-visual-emulator-qa.yml'
      - 'scripts/qa/AnyTvGraphiteVisualQaTest.kt'
permissions:
  contents: read
concurrency:
  group: anytv-code122-visual-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phone-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Prepare pinned upstream and AnyTV extensions
        run: |
          set -euo pipefail
          git init -q source
          git -C source remote add origin https://github.com/harimoradiya/androidtvremote.git
          git -C source fetch --depth 1 origin 16c68f0bb9d23f929ee8240f105fdb9000262d85
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "16c68f0bb9d23f929ee8240f105fdb9000262d85"
          TCL_RESCUE_STABLE=1 TCL_APPROVED_UI=1 TCL_RELEASE_SINGLE_APP=1 python3 scripts/prepare_tcl.py
          python3 scripts/apply_tcl_v21.py
          python3 scripts/apply_tcl_v22.py
          python3 scripts/apply_tcl_ptbr_cleanup.py
          python3 scripts/apply_tcl_i18n.py
          python3 scripts/apply_tcl_sticky_controls.py
          python3 scripts/apply_anytv_brand.py
          python3 scripts/apply_anytv_graphite_settings.py
          python3 scripts/apply_anytv_tv_tls_alias_isolation.py
          python3 scripts/apply_anytv_restore_connection.py
          python3 scripts/apply_anytv_premiere_reminder_manifest.py
          python3 scripts/apply_anytv_lg_webos.py
          python3 scripts/apply_anytv_lg_pointer_fix.py
          python3 scripts/apply_anytv_lg_apps.py
          python3 scripts/apply_anytv_lg_reconnect.py
          python3 scripts/apply_anytv_tcl_adb.py
      - name: Verify remote skin colors and untouched key layout (source-level)
        run: |
          python - <<'PY'
          from pathlib import Path
          pad = Path("overrides/TclResponsivePad.kt").read_text()
          home = Path("overrides/TclApprovedHomeScreen.kt").read_text()
          assert "val top = Color(0xFF212225)" in pad
          assert "val bottom = Color(0xFF1E1F22)" in pad
          assert ".anyTvCutGraphite(CircleShape)" in pad
          assert "internal fun Modifier.anyTvCutGraphite(" in home
          assert "Color(0xFF2B2B2B)" in home and "Color(0xFF242424)" in home
          assert "Color(0xFF777777).copy(alpha = .27f)" in home
          assert ".anyTvCutGraphite(CircleShape, largePad = true)" in pad
          assert "drawArc(Color(0xFF090A0B)" not in pad
          theme = Path("source/app/src/main/java/com/hari/androidtvremote/ui/theme/Theme.kt").read_text()
          assert "background = Color(0xFF242424)" in theme
          backdrop = Path("source/app/src/main/java/com/hari/androidtvremote/ui/app/UiBackdrop.kt").read_text()
          assert "rememberInfiniteTransition" not in backdrop.split("fun AppBackdrop(")[1]
          assert ".background(Color(0xFF242424))" in backdrop
          settings = Path("source/app/src/main/java/com/hari/androidtvremote/ui/app/SettingComponents.kt").read_text()
          assert settings.count(".anyTvCutGraphite(") >= 3
          assert ".border(0.72.dp, Color(0xFF101010).copy(alpha = .72f), shape)" in home
          assert "Color(0xFF422128).copy(alpha = .32f)" in Path("overrides/TclStreamingScreens.kt").read_text()
          assert all(k in pad for k in ["KEYCODE_DPAD_UP", "KEYCODE_DPAD_DOWN", "KEYCODE_DPAD_LEFT", "KEYCODE_DPAD_RIGHT", "KEYCODE_DPAD_CENTER"])
          labels = ['"Teclado", Icons.Filled.Keyboard', 'TclQuickAction("Início"', 'TclQuickAction("Microfone"', '"Voltar", Icons.Filled.KeyboardBackspace']
          indices = [home.index(s) for s in labels]
          assert indices == sorted(indices)
          assert home.index("onCyclePadMode()") < indices[2]
          assert "TclSideRocker(" in home and "TclHeaderAction(" in home
          print("ANYTV_REMOTE_GRAPHITE_SKIN_AND_LAYOUT_CONTRACT_PASS")
          PY
      - name: Compile one-shot Android TV metadata helper as bundled DEX (NO TV INSTALL)
        run: |
          set -euo pipefail
          mkdir -p /tmp/anytv-remote-class source/app/src/main/assets
          javac -source 8 -target 8 -cp "$ANDROID_HOME/platforms/android-36/android.jar" -d /tmp/anytv-remote-class scripts/qa/AnyTvRemoteMeta.java
          "$ANDROID_HOME/build-tools/36.0.0/d8" --min-api 28 --output source/app/src/main/assets /tmp/anytv-remote-class/anytv/adb/AnyTvRemoteMeta.class
          mv source/app/src/main/assets/classes.dex source/app/src/main/assets/anytv_remote_meta.dex
          test -s source/app/src/main/assets/anytv_remote_meta.dex
          echo ANYTV_NATIVE_TV_METADATA_DEX_COMPILED
      - name: Prepare current V2 version without signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/app/build.gradle.kts')
          source=p.read_text()
          assert source.count('versionCode = 34') == 1
          assert source.count('versionName = "2.9.5-AnyTV"') == 1
          p.write_text(source.replace('versionCode = 34','versionCode = 39')
                      .replace('versionName = "2.9.5-AnyTV"','versionName = "2.9.10-AnyTV"'))
          PY
      - name: Existing UI, link and safety contract tests
        env:
          TCL_V39: '1'
          TCL_V37: '1'
          TCL_V36: '1'
          TCL_V35: '1'
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_streaming_screens_contract.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_streaming_no_manual_credentials.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_approved_visual_contract.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_anytv_account_entry.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_anytv_ux_regression.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_anytv_lg_webos_contract.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_anytv_lg_pointer_contract.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_anytv_lg_apps_contract.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_anytv_lg_reconnect_contract.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_anytv_tcl_adb_phone_contract.py' -v
      - name: Prepare debug test identity only (NO release build, signer, OTA)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/app/build.gradle.kts')
          s=p.read_text()
          assert s.count('versionCode = 39') == 1
          assert s.count('versionName = "2.9.10-AnyTV"') == 1
          p.write_text(s.replace('versionCode = 39','versionCode = 122')
                      .replace('versionName = "2.9.10-AnyTV"','versionName = "2.9.94-AnyTV"'))
          PY
          python3 scripts/apply_anytv_phone_v2_identity.py
      - name: Install isolated screenshot instrumentation (never packaged in release)
        run: |
          set -euo pipefail
          mkdir -p source/app/src/androidTest/java/com/hari/androidtvremote/ui/app
          cp scripts/qa/AnyTvGraphiteVisualQaTest.kt source/app/src/androidTest/java/com/hari/androidtvremote/ui/app/AnyTvGraphiteVisualQaTest.kt
      - name: Enable VM KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrument actual Compose graphite rendering (isolated emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash -euo pipefail -c 'cd source && ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.hari.androidtvremote.ui.app.AnyTvGraphiteVisualQaTest --no-daemon --stacktrace && cd .. && mkdir -p visual-qa && IMG=$(adb shell find /sdcard/Android/data -name anytv-code122-graphite-real-compose.png | tr -d "\\r" | head -1) && test -n "$IMG" && adb pull "$IMG" visual-qa/graphite-code122-compose.png && test -s visual-qa/graphite-code122-compose.png && echo ANYTV_CODE122_REAL_COMPOSE_SCREENSHOT_CAPTURED'
      - uses: actions/upload-artifact@v4
        with:
          name: anytv-code122-graphite-real-compose-screenshot
          path: visual-qa/graphite-code122-compose.png
          if-no-files-found: error
