name: AnyTV P0 device proof tests (isolated)
on:
  push:
    branches:
      - feat/anytv-p0-device-proof-verifier-20261020
  pull_request:
    branches:
      - feat/tcl-v22-updates-back-bluetooth
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: anytv-resolver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/device-proof.mjs
          node --check src/device-proof.test.mjs
          node --check src/worker.mjs
      - name: SQLite activation transaction regressions
        run: python3 -m unittest discover -s tests -p 'test_device_activation_sql.py' -v
      - name: Cloudflare D1 local migration and activation smoke
        run: bash scripts/d1-local-smoke.sh
      - name: Validate staging workflow syntax and isolation contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          content = Path("../.github/workflows/anytv-p0-d1-staging-preflight.yml").read_text()
          required = ["workflow_dispatch:", "ANYTV_STAGING_CF_API_TOKEN", "ANYTV_STAGING_CF_ACCOUNT_ID", "9bab6598-d019-4e88-8b29-a327ff0cfd00", "--remote", "sqlite_master", "device_keys", "device_nonces", "device_activations"]
          for fragment in required:
              assert fragment in content, fragment
          assert "wrangler deploy" not in content
          assert "migrations apply" not in content
          PY
      - name: Cloudflare connectivity diagnostic, read only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "CLOUDFLARE_TOKEN_MISSING"; exit 0; fi
          python3 - <<'PY'
          import os, urllib.request, urllib.error, json
          root="https://api.cloudflare.com/client/v4/accounts/48172e80b82e7f0a2100e512831c48d2"
          for label, path in [("worker","/workers/scripts/anytv-link-resolver-pilot/settings"),("d1","/d1/database/9bab6598-d019-4e88-8b29-a327ff0cfd00")]:
              request=urllib.request.Request(root+path,headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"]})
              try:
                  with urllib.request.urlopen(request,timeout=12) as result:
                      body=json.load(result)
                      print(label+":accessible" if body.get("success") else label+":api_rejected")
              except urllib.error.HTTPError as e:
                  print(label+":http_"+str(e.code))
              except Exception as e:
                  print(label+":unreachable_"+type(e).__name__)
          PY
      - name: Resolver and device-proof regressions
        run: npm test
