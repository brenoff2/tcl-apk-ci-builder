name: AnyTV genre compiled Kotlin JVM fixtures (DEV QA ONLY)
on:
  push:
    branches:
      - feat/anytv-p0-device-proof-verifier-20261020
    paths:
      - '.github/workflows/anytv-genre-android-jvm-fixtures.yml'
      - 'scripts/qa/AnyTvGenreJvmFixtureTest.kt'
      - 'scripts/qa/AnyTvComposeHostSmokeTest.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genre-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Prepare pinned upstream Android source (QA runner only)
        run: |
          set -euo pipefail
          git init -q source
          git -C source remote add origin https://github.com/harimoradiya/androidtvremote.git
          git -C source fetch --depth 1 origin 16c68f0bb9d23f929ee8240f105fdb9000262d85
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "16c68f0bb9d23f929ee8240f105fdb9000262d85"
          TCL_RESCUE_STABLE=1 TCL_APPROVED_UI=1 TCL_RELEASE_SINGLE_APP=1 python3 scripts/prepare_tcl.py
          python3 scripts/apply_tcl_v21.py
          python3 scripts/apply_tcl_v22.py
          python3 scripts/apply_tcl_ptbr_cleanup.py
          python3 scripts/apply_tcl_i18n.py
          python3 scripts/apply_tcl_sticky_controls.py
          python3 scripts/apply_anytv_brand.py
          python3 scripts/apply_anytv_graphite_settings.py
          python3 scripts/apply_anytv_tv_tls_alias_isolation.py
          python3 scripts/apply_anytv_restore_connection.py
          python3 scripts/apply_anytv_premiere_reminder_manifest.py
          python3 scripts/apply_anytv_lg_webos.py
          python3 scripts/apply_anytv_lg_pointer_fix.py
          python3 scripts/apply_anytv_lg_apps.py
          python3 scripts/apply_anytv_lg_reconnect.py
          python3 scripts/apply_anytv_tcl_adb.py
      - name: Inject isolated JVM test against compiled AnyTV implementation
        run: |
          set -euo pipefail
          target=source/app/src/test/java/com/hari/androidtvremote/ui/app
          mkdir -p "$target"
          cp scripts/qa/AnyTvGenreJvmFixtureTest.kt "$target/"
          cp scripts/qa/AnyTvComposeHostSmokeTest.kt "$target/"
          # Use real JSONObject/JSONArray in JVM unit tests; ephemeral runner only.
          sed -i '/testImplementation(libs.junit)/a\    testImplementation("org.json:json:20240303")\n    testImplementation("org.robolectric:robolectric:4.17")\n    testImplementation(platform(libs.androidx.compose.bom))\n    testImplementation(libs.androidx.compose.ui.test.junit4)\n    testImplementation(libs.androidx.junit)' source/app/build.gradle.kts
          sed -i '/    lint {/i\    testOptions { unitTests.isIncludeAndroidResources = true }' source/app/build.gradle.kts
          grep -Fq 'private fun anyTvIsAnime(' overrides/TclStreamingScreens.kt
          grep -Fq 'private fun anyTvBackfillEditorial(' overrides/TclStreamingScreens.kt
          grep -Fq 'private fun anyTvCurate(' overrides/TclStreamingScreens.kt
          grep -Fq 'private fun anyTvResolvedGenre(' overrides/TclStreamingScreens.kt
      - name: Execute compiled Android app Kotlin unit tests (no emulator or APK)
        run: |
          set -euo pipefail
          cd source
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --tests '*AnyTvGenreJvmFixtureTest*' --tests '*AnyTvComposeHostSmokeTest*'
          echo ANYTV_COMPILED_KOTLIN_GENRE_AND_COMPOSE_HOST_SMOKE_PASS
      - name: QA isolation receipt
        if: always()
        run: |
          echo "DEV-only ephemeral Android JVM unit test; no assembly, signer, OTA, publishing, Worker/D1, TV or companion."
