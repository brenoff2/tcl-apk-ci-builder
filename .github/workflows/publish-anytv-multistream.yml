name: Publish AnyTV 2.9.3 and Connect 2.0 multi-provider title links
on:
  push:
    branches: ['feat/tcl-v22-updates-back-bluetooth']
    paths: ['.github/workflows/publish-anytv-multistream.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: anytv-multistream-293-20-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tcl-v22-updates-back-bluetooth
          fetch-depth: 0
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Verify prior successful integration and old update channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/runs/38760853429 --jq .conclusion)" = success
          test "$(gh api repos/${{ github.repository }}/actions/jobs/116508981421 --jq .conclusion)" = success
          test "$(gh api repos/${{ github.repository }}/releases/tags/tcl-phone-v2.9.2 --jq .tag_name)" = tcl-phone-v2.9.2
          test "$(gh api repos/${{ github.repository }}/releases/tags/tv-complemento-v1.9 --jq .tag_name)" = tv-complemento-v1.9
          ! gh release view tcl-phone-v2.9.3 >/dev/null 2>&1
          ! gh release view tv-complemento-v2.0 >/dev/null 2>&1
          echo 'f34510aebb686e88912b56eb6c2a6b655e5365b5d09c4e5ccb6dee97e5941e0d  updates/android/current.apk' | sha256sum -c -
          echo '66e5ccaaf47904222cd519e9f51f96c78f7d263e74ee05e85187dc9afdd60a8f  updates/tv/cert8b2b/current.apk' | sha256sum -c -
          echo '886dec21e2a867dfe1632a6cc11b2e6b971314e64aae31536fc9a5069d2c8800  updates/tv/cert3382/current.apk' | sha256sum -c -
      - name: Download signed immutable release candidates
        env:
          SRC_PHONE: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-396c-81f5-a91e-cbf9bdbf1993/raw?se=2026-10-15T15%3A47%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=fda7123f-de50-5958-a44f-84ebfbd74682&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T11%3A23%3A15Z&ske=2026-10-16T11%3A23%3A15Z&sks=b&skv=2026-02-06&sig=gR4xajeJhajsyFYzMa6uQ4OcM7lWT0f99rFIzsGc6/0%3D"
          SRC_TV8: "https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-3be4-822f-bf0a-796329b8e7dd/raw?se=2026-10-15T15%3A47%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=b8ea343b-844c-57b2-bff1-9d6524b138b7&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T12%3A31%3A37Z&ske=2026-10-16T12%3A31%3A37Z&sks=b&skv=2026-02-06&sig=Gh1q7jkA88ErkqxqcFzo22/1m9ku6XZ1BaJ7RBOjLb8%3D"
          SRC_TV3: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-d614-81f4-9646-075f3e9cdc76/raw?se=2026-10-15T15%3A47%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=5897d3ec-0f23-5320-97b3-baa0501a4ec0&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T12%3A31%3A30Z&ske=2026-10-16T12%3A31%3A30Z&sks=b&skv=2026-02-06&sig=Vp%2Bh1i3Zh0AMuxjQ%2BkyCV%2Bx/kMABW3kVkjsg1PpU714%3D"
        run: |
          set -euo pipefail
          mkdir -p signed
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 240 "$SRC_PHONE" -o signed/Controle_TCL_Livre_v2.9.3.apk
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 120 "$SRC_TV8" -o signed/Controle_TCL_TV_v2.0_cert8b2b.apk
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 120 "$SRC_TV3" -o signed/Controle_TCL_TV_v2.0_cert3382.apk
          echo 'd549be2c1a07bc7b6a7449300ac4bd5b07ebf760a723e55f8cf5bc5e2262f6bf  signed/Controle_TCL_Livre_v2.9.3.apk' | sha256sum -c -
          echo '4abd79f5deae11ba79578e22bb7cdfea491ae8d953a294102ec4fbc5f90fdf20  signed/Controle_TCL_TV_v2.0_cert8b2b.apk' | sha256sum -c -
          echo '9423c715d9c39d1ff8269370bce8ee8fe9fc96ec3ef0e149f5dc959d8d7a8cba  signed/Controle_TCL_TV_v2.0_cert3382.apk' | sha256sum -c -
      - name: Verify package name, version, original certificates and alignment
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          for item in 'phone Controle_TCL_Livre_v2.9.3.apk com.tclremote.livre 32 df72977485e8e5243048a7f1e8dff9fedcf2295161c4daae3834b6a16cd4e4c8' 'tv8 Controle_TCL_TV_v2.0_cert8b2b.apk com.tclremote.tvcompanion 11 8b2b0c6f2a7a668f9aae829be811241dc70c3697af2b3e6c71e1a1767a5d83da' 'tv3 Controle_TCL_TV_v2.0_cert3382.apk com.tclremote.tvcompanion 11 3382dfb12a0f16eb9167e056f947ea9740448fe07b8ef9d0ace0c889bf591add'; do
            read -r label name pkg ver cert <<< "$item"
            apk="signed/$name"
            "$BT/aapt" dump badging "$apk" | grep -q "name='$pkg' versionCode='$ver'"
            "$BT/apksigner" verify --verbose --print-certs "$apk" > "verify-$label.txt"
            grep -q '^Verifies$' "verify-$label.txt"
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "verify-$label.txt"
            grep -qi "$cert" "verify-$label.txt"
            "$BT/zipalign" -c 4 "$apk"
          done
      - name: Publish versioned releases and verify identical assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create tcl-phone-v2.9.3 signed/Controle_TCL_Livre_v2.9.3.apk --target feat/tcl-v22-updates-back-bluetooth --title 'AnyTV 2.9.3' --notes 'Provider-specific movie and TV deep links using public TMDB/Wikidata IDs, with safe search fallback. TV Connect 2.0 required for multiple services. Device homologation pending.' --latest=false
          gh release create tv-complemento-v2.0 signed/Controle_TCL_TV_v2.0_cert8b2b.apk signed/Controle_TCL_TV_v2.0_cert3382.apk --target feat/tcl-v22-updates-back-bluetooth --title 'AnyTV Connect 2.0' --notes 'Secure package-pinned links for Netflix, Disney+, Prime Video, Apple TV and Max. Existing pairing, inventory, Bluetooth and controls preserved. Individual apps require physical testing.' --latest=false
          mkdir -p release-phone release-tv
          gh release download tcl-phone-v2.9.3 -p '*.apk' -D release-phone
          gh release download tv-complemento-v2.0 -p '*.apk' -D release-tv
          cmp signed/Controle_TCL_Livre_v2.9.3.apk release-phone/Controle_TCL_Livre_v2.9.3.apk
          cmp signed/Controle_TCL_TV_v2.0_cert8b2b.apk release-tv/Controle_TCL_TV_v2.0_cert8b2b.apk
          cmp signed/Controle_TCL_TV_v2.0_cert3382.apk release-tv/Controle_TCL_TV_v2.0_cert3382.apk
      - name: Publish both versioned history and the CURRENT updater APKs
        run: |
          set -euo pipefail
          cp signed/Controle_TCL_Livre_v2.9.3.apk updates/android/AnyTV-v2.9.3.apk
          cp signed/Controle_TCL_Livre_v2.9.3.apk updates/android/current.apk
          cp signed/Controle_TCL_TV_v2.0_cert8b2b.apk updates/tv/cert8b2b/AnyTV-Connect-v2.0.apk
          cp signed/Controle_TCL_TV_v2.0_cert8b2b.apk updates/tv/cert8b2b/current.apk
          cp signed/Controle_TCL_TV_v2.0_cert3382.apk updates/tv/cert3382/AnyTV-Connect-v2.0.apk
          cp signed/Controle_TCL_TV_v2.0_cert3382.apk updates/tv/cert3382/current.apk
          cat > updates/android/current.json <<'JSON'
          {
            "schema": 1,
            "platform": "android",
            "package": "com.tclremote.livre",
            "available": true,
            "version": "2.9.3",
            "versionCode": 32,
            "tag": "tcl-phone-v2.9.3",
            "assets": [
              {
                "name": "Controle_TCL_Livre_v2.9.3.apk",
                "size": 28314468,
                "digest": "sha256:d549be2c1a07bc7b6a7449300ac4bd5b07ebf760a723e55f8cf5bc5e2262f6bf",
                "browser_download_url": "https://github.com/brenoff2/tcl-apk-ci-builder/releases/download/tcl-phone-v2.9.3/Controle_TCL_Livre_v2.9.3.apk"
              }
            ]
          }
          JSON
          cat > updates/tv/current.json <<'JSON'
          {
            "schema": 1,
            "platform": "tv",
            "package": "com.tclremote.tvcompanion",
            "available": true,
            "version": "2.0",
            "tag": "tv-complemento-v2.0",
            "assets": [
              {
                "name": "Controle_TCL_TV_v2.0_cert8b2b.apk",
                "size": 320191,
                "digest": "sha256:4abd79f5deae11ba79578e22bb7cdfea491ae8d953a294102ec4fbc5f90fdf20",
                "browser_download_url": "https://github.com/brenoff2/tcl-apk-ci-builder/releases/download/tv-complemento-v2.0/Controle_TCL_TV_v2.0_cert8b2b.apk"
              },
              {
                "name": "Controle_TCL_TV_v2.0_cert3382.apk",
                "size": 320191,
                "digest": "sha256:9423c715d9c39d1ff8269370bce8ee8fe9fc96ec3ef0e149f5dc959d8d7a8cba",
                "browser_download_url": "https://github.com/brenoff2/tcl-apk-ci-builder/releases/download/tv-complemento-v2.0/Controle_TCL_TV_v2.0_cert3382.apk"
              }
            ]
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f updates/android/current.apk updates/android/AnyTV-v2.9.3.apk updates/android/current.json updates/tv/cert8b2b/current.apk updates/tv/cert8b2b/AnyTV-Connect-v2.0.apk updates/tv/cert3382/current.apk updates/tv/cert3382/AnyTV-Connect-v2.0.apk updates/tv/current.json
          git diff --cached --quiet && { echo 'Expected new update binaries'; exit 1; }
          git commit -m 'release(anytv): compatible provider title links phone 2.9.3 TV 2.0 [skip ci]'
          git push origin HEAD:feat/tcl-v22-updates-back-bluetooth
          cmp signed/Controle_TCL_Livre_v2.9.3.apk updates/android/current.apk
          cmp signed/Controle_TCL_TV_v2.0_cert8b2b.apk updates/tv/cert8b2b/current.apk
          cmp signed/Controle_TCL_TV_v2.0_cert3382.apk updates/tv/cert3382/current.apk
      - name: Verify public updater URLs download the exact new bytes
        run: |
          set -euo pipefail
          root='https://raw.githubusercontent.com/brenoff2/tcl-apk-ci-builder/feat/tcl-v22-updates-back-bluetooth/updates'
          for entry in 'android/current.apk d549be2c1a07bc7b6a7449300ac4bd5b07ebf760a723e55f8cf5bc5e2262f6bf' 'tv/cert8b2b/current.apk 4abd79f5deae11ba79578e22bb7cdfea491ae8d953a294102ec4fbc5f90fdf20' 'tv/cert3382/current.apk 9423c715d9c39d1ff8269370bce8ee8fe9fc96ec3ef0e149f5dc959d8d7a8cba'; do
            read -r path expected <<< "$entry"
            ok=0
            for n in $(seq 1 12); do
              if curl -fLsS --max-time 90 "${root}/${path}?check=${GITHUB_RUN_ID}-${n}" -o public-current.apk &&
                 test "$(sha256sum public-current.apk | cut -d' ' -f1)" = "$expected"; then ok=1; break; fi
              sleep 4
            done
            test "$ok" = 1 || { echo "PUBLIC_CURRENT_WRONG: $path"; exit 1; }
          done
          echo 'ANYTV_MULTI_PROVIDER_293_20_ALL_CURRENT_PUBLIC_HASHES_VERIFIED'
