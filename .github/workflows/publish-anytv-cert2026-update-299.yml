name: Publish AnyTV phone 2.9.9 cert2026 OTA (verified signed APK)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: anytv-cert2026-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_URL: ${{ inputs.signed_apk_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tcl-v22-updates-back-bluetooth
          fetch-depth: 0
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Confirm Android 2.9.9 candidate CI was successful
        run: |
          set -euo pipefail
          gh api repos/brenoff2/tcl-apk-ci-builder/actions/runs/39699948020 --jq '.conclusion + " " + .head_branch' | grep -Fx 'success feat/anytv-p0-device-proof-verifier-20261020'
      - name: Download audited unsigned Android 2.9.9 from successful CI
        run: |
          set -euo pipefail
          mkdir -p incoming signed
          gh run download 39699948020 --name anytv-p0-unsigned-audit --dir incoming
          echo 'f281d46db59042aa52d8c0c233b439bab20889135c952b83b6b9412394102ca2  incoming/AnyTV_2_9_9_RELEASE_UNSIGNED.apk' | sha256sum -c -
      - name: Reconstruct audited signed package without private signing keys
        run: |
          set -euo pipefail
          test -s .github/anytv-299-patch/signed-reconstruction.json || { echo 'Missing complete verified signed reconstruction metadata; refuse publication'; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y zstd
          python3 scripts/reconstruct_anytv_signed_from_metadata.py incoming/AnyTV_2_9_9_RELEASE_UNSIGNED.apk .github/anytv-299-patch/signed-reconstruction.json signed/AnyTV_2_9_9_SIGNED_CERT2026.apk
          echo '56142e5f3e33d54f1be41c5f702b0d8e1bf00bff206e3c011438a5c2648a2a93  signed/AnyTV_2_9_9_SIGNED_CERT2026.apk' | sha256sum -c -
      - name: Verify package version signing identity and installed upgrade path
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          FILE=signed/AnyTV_2_9_9_SIGNED_CERT2026.apk
          "$BT/aapt" dump badging "$FILE" | grep -q "name='com.tclremote.livre' versionCode='38' versionName='2.9.9-AnyTV'"
          "$BT/apksigner" verify --verbose --print-certs "$FILE" > verified.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' verified.txt
          grep -qi '2f14e43f7653a75f878c4d59a4a8ad462ade17c52bde23e802c8c6ed43ade95f' verified.txt
          "$BT/zipalign" -c 4 "$FILE"
          echo '18a568f5d84f0eab95a25d5ab36ea7a150eb53259158c4d559151463685d4c17  updates/android/cert2026/current.apk' | sha256sum -c -
          "$BT/aapt" dump badging updates/android/cert2026/current.apk | grep -q "name='com.tclremote.livre' versionCode='37'"
      - name: Publish verified signed APK into existing OTA channel
        run: |
          set -euo pipefail
          cp signed/AnyTV_2_9_9_SIGNED_CERT2026.apk updates/android/cert2026/current.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f updates/android/cert2026/current.apk
          git diff --cached --check
          git diff --cached --quiet && { echo 'No OTA change detected'; exit 1; }
          git commit -m 'release(anytv): publish verified 2.9.9 cert2026 OTA [skip ci]'
          git push origin HEAD:feat/tcl-v22-updates-back-bluetooth
      - name: Read back OTA binary to prove publication
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            curl -fsSL --retry 2 "https://raw.githubusercontent.com/brenoff2/tcl-apk-ci-builder/feat/tcl-v22-updates-back-bluetooth/updates/android/cert2026/current.apk?attempt=$attempt" -o published.apk || true
            if test -s published.apk && cmp -s published.apk signed/AnyTV_2_9_9_SIGNED_CERT2026.apk; then
              echo 'ANYTV_299_CERT2026_OTA_PUBLISHED_READBACK_OK'
              exit 0
            fi
            sleep 10
          done
          echo 'OTA readback mismatch' >&2
          exit 1
