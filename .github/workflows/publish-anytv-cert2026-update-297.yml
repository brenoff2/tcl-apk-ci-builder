name: Publish cert2026 OTA update (phone 2.9.7 / TV 2.4)
on:
  push:
    branches: ['feat/tcl-v22-updates-back-bluetooth']
    paths: ['.github/workflows/publish-anytv-cert2026-update-297.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: anytv-cert2026-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tcl-v22-updates-back-bluetooth
          fetch-depth: 0
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Reconstruct signed phone APK from exact successful unsigned build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming signed
          gh run download 38813235585 --name ANYTV_PHONE_2_9_5_UNSIGNED_TO_SIGN --dir incoming
          echo '821a85c3657a6ebb4ffa66cc177c238d0dbae2d176daae6221565f911748b87a  incoming/AnyTV_2_9_7_RELEASE_UNSIGNED.apk' | sha256sum -c -
          echo '337b2c57e5aa498747985a62c36b66982a096ffad9e3c1c272fe1764efb1082f  .github/anytv-297-patch/phone-signed.patch.zst' | sha256sum -c -
          zstd -d -f --patch-from=incoming/AnyTV_2_9_7_RELEASE_UNSIGNED.apk .github/anytv-297-patch/phone-signed.patch.zst -o signed/AnyTV-v2.9.7.apk
          cp .github/anytv-297-patch/tv-signed.apk signed/AnyTV-Connect-v2.4.apk
          echo '62efa9f9bef57fdeedba2276b2e934e751877e94ceb5f8ef9f98913dd2a72c2b  signed/AnyTV-v2.9.7.apk' | sha256sum -c -
          echo 'ab528b640e4c60ba68ecffe70f027003d4103bf288db9184610539d2d8c365dc  signed/AnyTV-Connect-v2.4.apk' | sha256sum -c -
      - name: Check matching permanent certificates and newer version codes
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging signed/AnyTV-v2.9.7.apk | grep -q "name='com.tclremote.livre' versionCode='36'"
          "$BT/aapt" dump badging signed/AnyTV-Connect-v2.4.apk | grep -q "name='com.tclremote.tvcompanion' versionCode='15'"
          "$BT/apksigner" verify --verbose --print-certs signed/AnyTV-v2.9.7.apk > phone-cert.txt
          "$BT/apksigner" verify --verbose --print-certs signed/AnyTV-Connect-v2.4.apk > tv-cert.txt
          grep -q '^Verifies$' phone-cert.txt
          grep -q '^Verifies$' tv-cert.txt
          grep -qi '2f14e43f7653a75f878c4d59a4a8ad462ade17c52bde23e802c8c6ed43ade95f' phone-cert.txt
          grep -qi '0a5427237a2445c42520236469563dabceda6d43310fe4e6aea6af8ddffc223c' tv-cert.txt
          "$BT/zipalign" -c 4 signed/AnyTV-v2.9.7.apk
          "$BT/zipalign" -c 4 signed/AnyTV-Connect-v2.4.apk
      - name: Publish ONLY the new signing identity channels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p updates/android/cert2026 updates/tv/cert2026
          cp signed/AnyTV-v2.9.7.apk updates/android/cert2026/current.apk
          cp signed/AnyTV-Connect-v2.4.apk updates/tv/cert2026/current.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f updates/android/cert2026/current.apk updates/tv/cert2026/current.apk
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'release(anytv): cert2026 OTA baselines 2.9.7 and 2.4 [skip ci]'
            git push origin HEAD:feat/tcl-v22-updates-back-bluetooth
          fi
      - name: Confirm published GitHub raw bytes and hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir fetched
          for i in 1 2 3 4 5 6; do
            ok=1
            curl -fLsS --retry 2 "https://raw.githubusercontent.com/brenoff2/tcl-apk-ci-builder/feat/tcl-v22-updates-back-bluetooth/updates/android/cert2026/current.apk?attempt=$i" -o fetched/phone.apk || ok=0
            curl -fLsS --retry 2 "https://raw.githubusercontent.com/brenoff2/tcl-apk-ci-builder/feat/tcl-v22-updates-back-bluetooth/updates/tv/cert2026/current.apk?attempt=$i" -o fetched/tv.apk || ok=0
            if [ "$ok" = 1 ] && cmp -s fetched/phone.apk signed/AnyTV-v2.9.7.apk && cmp -s fetched/tv.apk signed/AnyTV-Connect-v2.4.apk; then
              echo 'ANYTV_CERT2026_CHANNELS_PUBLISHED_READBACK_OK'
              exit 0
            fi
            sleep 10
          done
          echo 'Readback failed; do not mark OTA published' >&2
          exit 1
