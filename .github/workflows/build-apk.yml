name: Build Controle TCL APK (fora Oracle)
on:
  push:
    branches: ['feat/android-apk-no-ads']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tcl-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Python e Pillow para ícones opacos
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fonte Apache-2.0 fixada
        run: |
          git clone --depth 1 https://github.com/harimoradiya/androidtvremote.git source
          test "$(git -C source rev-parse HEAD)" = "16c68f0bb9d23f929ee8240f105fdb9000262d85"
      - name: Remover rastreamento e adicionar IP manual
        run: |
          python3 scripts/prepare_tcl.py
          ! grep -E 'libs[.]firebase|plugins[.]firebase' source/app/build.gradle.kts
      - name: Compilar APK Android
        run: |
          cd source
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verificar APK assinado
        run: |
          mkdir -p output
          cp source/app/build/outputs/apk/debug/app-debug.apk output/Controle_TCL_Livre_v1.3_CI.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose output/Controle_TCL_Livre_v1.3_CI.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging output/Controle_TCL_Livre_v1.3_CI.apk | head -n 8
          unzip -l output/Controle_TCL_Livre_v1.3_CI.apk | grep classes.dex
          sha256sum output/Controle_TCL_Livre_v1.3_CI.apk | tee output/SHA256.txt
          cp source/LICENSE output/LICENSE-APACHE-2.0.txt
      - name: Salvar APK nos artefatos do PR
        uses: actions/upload-artifact@v4
        with:
          name: Controle_TCL_V1_3_CI
          path: output/
          if-no-files-found: error
          retention-days: 30
