name: TCL 2.1 - Dpad longo, numeros completos e teclado ao vivo

on:
  push:
    branches: ['fix/tcl-v21-pad-ime-hold']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcl-v21-phone
  cancel-in-progress: true

jobs:
  release-source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Checkout pinned Apache-2.0 remote source
        run: |
          git clone --depth 1 https://github.com/harimoradiya/androidtvremote.git source
          test "$(git -C source rev-parse HEAD)" = "16c68f0bb9d23f929ee8240f105fdb9000262d85"
      - name: Prepare stable single-app v2.0 base and apply v2.1 fix
        run: |
          TCL_RESCUE_STABLE=1 TCL_APPROVED_UI=1 TCL_RELEASE_SINGLE_APP=1 python3 scripts/prepare_tcl.py
          python3 scripts/apply_tcl_v21.py
          grep -q 'applicationId = "com.tclremote.livre"' source/app/build.gradle.kts
          grep -q 'versionCode = 21' source/app/build.gradle.kts
          ! grep -q 'com.tclremote.livre.preview' source/app/build.gradle.kts
      - name: Test all remote / input / appearance contracts
        env:
          TCL_APPROVED_UI: '1'
          TCL_RELEASE_SINGLE_APP: '1'
          TCL_V21: '1'
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_rescue_contract.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_approved_visual_contract.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_tcl_v21_contract.py' -v
      - name: Build production release
        run: |
          cd source
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Prepare ZIPALIGNED unsigned release for persistent signer
        run: |
          set -euo pipefail
          mkdir -p output
          APK=source/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging "$APK" > output/identidade.txt
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml > output/manifesto.txt
          grep -q "name='com.tclremote.livre' versionCode='21'" output/identidade.txt
          "$BT/zipalign" -f 4 "$APK" output/Controle_TCL_2.1_RELEASE_ALIGNED_UNSIGNED.apk
          "$BT/zipalign" -c 4 output/Controle_TCL_2.1_RELEASE_ALIGNED_UNSIGNED.apk
          sha256sum output/Controle_TCL_2.1_RELEASE_ALIGNED_UNSIGNED.apk > output/SHA256.txt
          echo 'ATENCAO: APK DESASSINADO. Assinar com a MESMA chave permanente do v2.0. Nunca instalar bruto.' > output/LEIA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TCL_21_RELEASE_ALIGNED_UNSIGNED_ASSINAR_COM_CHAVE_2_0
          path: output/
          if-no-files-found: error
          retention-days: 30
