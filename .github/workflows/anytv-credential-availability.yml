name: AnyTV secure credential availability gate
on:
  push:
    branches: ['feat/tcl-v22-updates-back-bluetooth']
    paths: ['.github/workflows/anytv-credential-availability.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MOVIE_KEY: ${{ secrets.ANYTV_MOVIE_API_KEY }}
      TMDB_KEY: ${{ secrets.ANYTV_TMDB_READ_TOKEN }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Report credential presence only, never values
        shell: bash
        run: |
          set -euo pipefail
          for pair in MOVIE_KEY:movieofthenight TMDB_KEY:tmdb CLOUDFLARE_TOKEN:cloudflare; do
            name="${pair%%:*}"
            label="${pair#*:}"
            if [ -n "${!name:-}" ]; then
              echo "$label:present"
            else
              echo "$label:missing"
            fi
          done
          echo 'Availability check only. No secret or APK was deployed.'
