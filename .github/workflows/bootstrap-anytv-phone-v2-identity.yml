name: AnyTV | Bootstrap controlado da identidade Android V2
# Nao publica OTA nem altera o app/identidade cert2026 ja instalado.
on:
  push:
    branches: [feat/anytv-p0-device-proof-verifier-20261020]
    paths:
      - .github/anytv-signer-v2-bootstrap-request.json
permissions:
  contents: write
concurrency:
  group: anytv-phone-signer-v2-bootstrap
  cancel-in-progress: false
jobs:
  create-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact approved trigger
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Enforce one-time request and no existing identity
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema == 1 and .intent == "bootstrap-phone-v2-2026" and .no_ota_publication == true' .github/anytv-signer-v2-bootstrap-request.json >/dev/null
          test ! -e signing-recovery/v2/phone-signer.aesgcm
          test ! -e signing-recovery/v2/identity.json
          test ! -e signing-recovery/v2/phone-cert.pem
      - name: Install audited local crypto library
        run: python3 -m pip install -q 'cryptography==46.0.3'
      - name: Generate new RSA signer and encrypt key store entirely in memory
        shell: bash
        env:
          V2_RECOVERY_HEX: ${{ secrets.ANYTV_SIGNER_V2_RECOVERY_HEX }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, datetime, hashlib, hmac, json, os, pathlib
          from cryptography import x509
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import rsa, padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.serialization import pkcs12
          from cryptography.x509.oid import NameOID
          secret = os.environ.get('V2_RECOVERY_HEX','')
          if len(secret) != 64 or any(c not in '0123456789abcdefABCDEF' for c in secret):
              raise RuntimeError('GitHub Actions V2 recovery secret missing or invalid; no identity created')
          key = bytes.fromhex(secret)
          folder = pathlib.Path('signing-recovery/v2')
          folder.mkdir(parents=True,exist_ok=True)
          signer = rsa.generate_private_key(public_exponent=65537,key_size=3072)
          subject = x509.Name([x509.NameAttribute(NameOID.COMMON_NAME,'AnyTV Android Phone Signing V2 2026'),x509.NameAttribute(NameOID.ORGANIZATION_NAME,'AnyTV')])
          now = datetime.datetime.now(datetime.timezone.utc)
          cert = (x509.CertificateBuilder().subject_name(subject).issuer_name(subject).public_key(signer.public_key())
              .serial_number(x509.random_serial_number()).not_valid_before(now-datetime.timedelta(days=1))
              .not_valid_after(now+datetime.timedelta(days=365*30))
              .add_extension(x509.BasicConstraints(ca=False,path_length=None),critical=True)
              .sign(signer,hashes.SHA256()))
          pw = base64.urlsafe_b64encode(hmac.new(key,b'AnyTV-Phone-V2-PKCS12-Pass-v1',hashlib.sha256).digest())
          p12 = pkcs12.serialize_key_and_certificates(b'anytv-phone-v2',signer,cert,None,serialization.BestAvailableEncryption(pw))
          nonce = os.urandom(12)
          encrypted = b'ANYTVV2G1'+nonce+AESGCM(key).encrypt(nonce,p12,None)
          f = folder/'phone-signer.aesgcm'
          f.write_bytes(encrypted)
          cert_pem=cert.public_bytes(serialization.Encoding.PEM)
          (folder/'phone-cert.pem').write_bytes(cert_pem)
          digest=cert.fingerprint(hashes.SHA256()).hex()
          # Test BOTH cryptographic envelope and signer key, without plaintext outputs.
          restored=AESGCM(key).decrypt(encrypted[9:21],encrypted[21:],None)
          k,c,_=pkcs12.load_key_and_certificates(restored,pw)
          assert c.fingerprint(hashes.SHA256()).hex()==digest
          challenge=os.urandom(32)
          signature=k.sign(challenge,padding.PKCS1v15(),hashes.SHA256())
          c.public_key().verify(signature,challenge,padding.PKCS1v15(),hashes.SHA256())
          meta={'schema':1,'role':'Android phone V2 independent signer','package_policy':'new install only; never overwrite cert2026 OTA','certificate_sha256':digest,
                'ciphertext_sha256':hashlib.sha256(encrypted).hexdigest(),'key_algorithm':'RSA-3072',
                'envelope':'ANYTVV2G1 + 12B nonce + AES-256-GCM ciphertext/tag','pkcs12_password_derivation':'HMAC-SHA256(recovery, AnyTV-Phone-V2-PKCS12-Pass-v1), base64url',
                'github_actions_recovery_secret':'ANYTV_SIGNER_V2_RECOVERY_HEX','created_at':now.isoformat(),
                'verification':'AES-GCM authenticated roundtrip + PKCS12 signer public-key challenge OK'}
          (folder/'identity.json').write_text(json.dumps(meta,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('NEW_ANYTV_V2_IDENTITY_IN_MEMORY_GENERATED_AND_DECRYPTION_VERIFIED')
          print('V2_PUBLIC_CERT_SHA256='+digest)
          PY
      - name: Store ONLY encrypted signer and public certificate in GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add signing-recovery/v2/phone-signer.aesgcm signing-recovery/v2/phone-cert.pem signing-recovery/v2/identity.json
          git diff --cached --check
          git commit -m 'security(anytv): encrypted durable phone V2 signer and public cert [skip ci]'
          git push origin HEAD:feat/anytv-p0-device-proof-verifier-20261020
      - name: Read back encrypted bytes from remote Git and verify identity recovery
        shell: bash
        env:
          V2_RECOVERY_HEX: ${{ secrets.ANYTV_SIGNER_V2_RECOVERY_HEX }}
        run: |
          set -euo pipefail
          git fetch origin feat/anytv-p0-device-proof-verifier-20261020
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git show origin/feat/anytv-p0-device-proof-verifier-20261020:signing-recovery/v2/phone-signer.aesgcm > "$tmp/from-github.aesgcm"
          git show origin/feat/anytv-p0-device-proof-verifier-20261020:signing-recovery/v2/identity.json > "$tmp/from-github.json"
          cmp "$tmp/from-github.aesgcm" signing-recovery/v2/phone-signer.aesgcm
          python3 - "$tmp" <<'PY'
          import base64,hashlib,hmac,json,os,pathlib,sys
          from cryptography import x509
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.serialization import pkcs12
          root=pathlib.Path(sys.argv[1])
          encrypted=(root/'from-github.aesgcm').read_bytes()
          meta=json.loads((root/'from-github.json').read_text())
          key=bytes.fromhex(os.environ['V2_RECOVERY_HEX'])
          assert encrypted[:9]==b'ANYTVV2G1'
          pw=base64.urlsafe_b64encode(hmac.new(key,b'AnyTV-Phone-V2-PKCS12-Pass-v1',hashlib.sha256).digest())
          clear=AESGCM(key).decrypt(encrypted[9:21],encrypted[21:],None)
          signer,cert,_=pkcs12.load_key_and_certificates(clear,pw)
          assert signer and cert
          assert cert.fingerprint(hashes.SHA256()).hex()==meta['certificate_sha256']
          assert hashlib.sha256(encrypted).hexdigest()==meta['ciphertext_sha256']
          print('ANYTV_V2_SIGNER_GITHUB_ENCRYPTED_READBACK_AND_RECOVERY_PASS')
          print('V2_PUBLIC_CERT_SHA256='+meta['certificate_sha256'])
          PY
