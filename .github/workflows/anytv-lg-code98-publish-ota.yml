name: AnyTV LG code98 publish signed in-app OTA (one-shot)
on:
  push:
    branches: ['feat/anytv-p0-device-proof-verifier-20261020']
    paths: ['.github/workflows/anytv-lg-code98-publish-ota.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: anytv-v2-official-ota-code98-publish
  cancel-in-progress: false
jobs:
  publish-verified-code98:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve signed LG code98 from verified QA run
        uses: actions/download-artifact@v4
        with:
          run-id: 42793491503
          name: anytv-lg-code98-signed-qa-test-only
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: signed-code98
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Validate signed source and immutable OTA baseline
        shell: bash
        run: |
          set -euo pipefail
          APK=signed-code98/AnyTV_LG_2.9.70_code98_SIGNED_QA.apk
          test -s "$APK"
          test "$(find signed-code98 -name '*.apk' -type f | wc -l)" -eq 1
          grep -Fq 'd72581ce5ebe7821a45e0b7017ba0cb1d621472e67b5a0bbfc7015dbc64de346' signed-code98/SHA256.txt
          test "$(sha256sum "$APK" | cut -d ' ' -f1)" = 'd72581ce5ebe7821a45e0b7017ba0cb1d621472e67b5a0bbfc7015dbc64de346'
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > signed-code98/audit-check.txt
          grep -qi 'fe8c59e4f656af52f89e4430f7ba552aded37beb808a7e9953f534c5ebfe56d9' signed-code98/audit-check.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' signed-code98/audit-check.txt
          "$BT/aapt" dump badging "$APK" > signed-code98/identity-check.txt
          grep -q "name='com.tclremote.livre.v2' versionCode='98'" signed-code98/identity-check.txt
          grep -q "versionName='2.9.70-AnyTV'" signed-code98/identity-check.txt
          "$BT/zipalign" -c 4 "$APK"
          git fetch --no-tags origin feat/tcl-v22-updates-back-bluetooth
          test "$(git rev-parse origin/feat/tcl-v22-updates-back-bluetooth)" = '46f5637cc5ee5f8804c1b15c44984545f14bc2b0'
          git show '46f5637cc5ee5f8804c1b15c44984545f14bc2b0:updates/android/v2/current.apk' > previous-v2-code97.apk
          "$BT/apksigner" verify --verbose --print-certs previous-v2-code97.apk > previous-audit.txt
          grep -qi 'fe8c59e4f656af52f89e4430f7ba552aded37beb808a7e9953f534c5ebfe56d9' previous-audit.txt
          "$BT/aapt" dump badging previous-v2-code97.apk > previous-badging.txt
          grep -q "name='com.tclremote.livre.v2' versionCode='97'" previous-badging.txt
          grep -q "versionName='2.9.69-AnyTV'" previous-badging.txt
          echo 'LG_CODE98_OTA_BASELINE_AND_SIGNATURE_VERIFIED'
      - name: Publish only V2 current.apk to existing in-app OTA channel
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=feat/tcl-v22-updates-back-bluetooth
          EXPECTED=46f5637cc5ee5f8804c1b15c44984545f14bc2b0
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED"
          git worktree add --detach ota-v2 "$EXPECTED"
          test -s ota-v2/updates/android/cert2026/current.apk
          cp signed-code98/AnyTV_LG_2.9.70_code98_SIGNED_QA.apk ota-v2/updates/android/v2/current.apk
          (
            cd ota-v2
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f updates/android/v2/current.apk
            test "$(git diff --cached --name-only)" = "updates/android/v2/current.apk"
            git diff --cached --check
            git commit -m 'release(anytv-v2): LG webOS signed code98 in-app OTA'
            test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED"
            git push origin HEAD:"$BRANCH"
          )
          echo 'LG_CODE98_OTA_PUSH_COMPLETE'
      - name: Read back published binary using immutable commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA=d72581ce5ebe7821a45e0b7017ba0cb1d621472e67b5a0bbfc7015dbc64de346
          NEW_COMMIT="$(git -C ota-v2 rev-parse HEAD)"
          CURRENT="$(git ls-remote origin refs/heads/feat/tcl-v22-updates-back-bluetooth | cut -f1)"
          test "$NEW_COMMIT" = "$CURRENT"
          for n in 1 2 3 4 5 6; do
            curl --fail --silent --show-error --location --retry 2 "https://raw.githubusercontent.com/brenoff2/tcl-apk-ci-builder/$NEW_COMMIT/updates/android/v2/current.apk?verify=$n" -o readback-code98.apk || true
            if test -s readback-code98.apk && test "$(sha256sum readback-code98.apk | cut -d ' ' -f1)" = "$EXPECTED_SHA"; then
              echo "LG_CODE98_OTA_READBACK_VERIFIED_SHA256_$EXPECTED_SHA"
              echo "LG_CODE98_OTA_COMMIT_$NEW_COMMIT"
              exit 0
            fi
            sleep 10
          done
          echo 'LG_CODE98_PUBLISHED_BUT_READBACK_UNVERIFIED'
          exit 1
