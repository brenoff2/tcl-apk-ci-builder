name: AnyTV LG code99 publish signed in-app OTA (MANUAL ONLY)
on:
  workflow_dispatch:
    inputs:
      signed_run_id:
        description: GitHub Actions run ID for verified code99 signed candidate
        required: true
        type: string
      signed_sha256:
        description: Expected SHA256 for the signed code99 APK
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: anytv-v2-official-ota-code99-publish
  cancel-in-progress: false
jobs:
  publish-verified-code99:
    runs-on: ubuntu-latest
    environment: anytv-ota-approval
    env:
      SIGNED_SHA256: ${{ inputs.signed_sha256 }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve signed LG code99 from verified QA run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.signed_run_id }}
          name: anytv-lg-code99-signed-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: signed-code99
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Validate signed source and immutable OTA baseline
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SIGNED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Missing/invalid signed APK SHA256'; exit 1; }
          APK=signed-code99/AnyTV_LG_2.9.71_code99_SIGNED_CANDIDATE.apk
          test -s "$APK"
          test "$(find signed-code99 -name '*.apk' -type f | wc -l)" -eq 1
          grep -Fq "$SIGNED_SHA256" signed-code99/SHA256.txt
          test "$(sha256sum "$APK" | cut -d ' ' -f1)" = "$SIGNED_SHA256"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > signed-code99/audit-check.txt
          grep -qi 'fe8c59e4f656af52f89e4430f7ba552aded37beb808a7e9953f534c5ebfe56d9' signed-code99/audit-check.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' signed-code99/audit-check.txt
          "$BT/aapt" dump badging "$APK" > signed-code99/identity-check.txt
          grep -q "name='com.tclremote.livre.v2' versionCode='99'" signed-code99/identity-check.txt
          grep -q "versionName='2.9.71-AnyTV'" signed-code99/identity-check.txt
          "$BT/zipalign" -c 4 "$APK"
          git fetch --no-tags origin feat/tcl-v22-updates-back-bluetooth
          test "$(git rev-parse origin/feat/tcl-v22-updates-back-bluetooth)" = '94c02790fdf496d3fdcdcc0c1a4c71b93e8a2896'
          git show '94c02790fdf496d3fdcdcc0c1a4c71b93e8a2896:updates/android/v2/current.apk' > previous-v2-code98.apk
          test "$(sha256sum previous-v2-code98.apk | cut -d ' ' -f1)" = 'd72581ce5ebe7821a45e0b7017ba0cb1d621472e67b5a0bbfc7015dbc64de346'
          "$BT/apksigner" verify --verbose --print-certs previous-v2-code98.apk > previous-audit.txt
          grep -qi 'fe8c59e4f656af52f89e4430f7ba552aded37beb808a7e9953f534c5ebfe56d9' previous-audit.txt
          "$BT/aapt" dump badging previous-v2-code98.apk > previous-badging.txt
          grep -q "name='com.tclremote.livre.v2' versionCode='98'" previous-badging.txt
          grep -q "versionName='2.9.70-AnyTV'" previous-badging.txt
          echo 'LG_CODE99_OTA_BASELINE_AND_SIGNATURE_VERIFIED'
      - name: Publish only V2 current.apk to existing in-app OTA channel
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=feat/tcl-v22-updates-back-bluetooth
          EXPECTED=94c02790fdf496d3fdcdcc0c1a4c71b93e8a2896
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED"
          git worktree add --detach ota-v2 "$EXPECTED"
          test -s ota-v2/updates/android/cert2026/current.apk
          cp signed-code99/AnyTV_LG_2.9.71_code99_SIGNED_CANDIDATE.apk ota-v2/updates/android/v2/current.apk
          (
            cd ota-v2
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f updates/android/v2/current.apk
            test "$(git diff --cached --name-only)" = "updates/android/v2/current.apk"
            git diff --cached --check
            git commit -m 'release(anytv-v2): LG webOS signed code99 in-app OTA'
            test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED"
            git push origin HEAD:"$BRANCH"
          )
          echo 'LG_CODE99_OTA_PUSH_COMPLETE'
      - name: Read back published binary using immutable commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA=$SIGNED_SHA256
          NEW_COMMIT="$(git -C ota-v2 rev-parse HEAD)"
          CURRENT="$(git ls-remote origin refs/heads/feat/tcl-v22-updates-back-bluetooth | cut -f1)"
          test "$NEW_COMMIT" = "$CURRENT"
          for n in 1 2 3 4 5 6; do
            curl --fail --silent --show-error --location --retry 2 "https://raw.githubusercontent.com/brenoff2/tcl-apk-ci-builder/$NEW_COMMIT/updates/android/v2/current.apk?verify=$n" -o readback-code99.apk || true
            if test -s readback-code99.apk && test "$(sha256sum readback-code99.apk | cut -d ' ' -f1)" = "$EXPECTED_SHA"; then
              echo "LG_CODE99_OTA_READBACK_VERIFIED_SHA256_$EXPECTED_SHA"
              echo "LG_CODE99_OTA_COMMIT_$NEW_COMMIT"
              exit 0
            fi
            sleep 10
          done
          echo 'LG_CODE99_PUBLISHED_BUT_READBACK_UNVERIFIED'
          exit 1
