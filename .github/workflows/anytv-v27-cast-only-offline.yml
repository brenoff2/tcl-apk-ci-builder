name: AnyTV v27 cast-only candidate offline verification
on:
  push:
    branches: ['fix/anytv-v27-cast-only-20261108']
    paths:
      - 'anytv-resolver/cast-v27-candidate/**'
      - '.github/workflows/anytv-v27-cast-only-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify all four isolated original modules have valid JS syntax
        run: |
          set -euo pipefail
          for file in anytv-resolver/cast-v27-candidate/*.mjs; do
            node --check "$file"
          done
      - name: Verify movie and TV credits, cache, invalid requests
        run: node --test anytv-resolver/cast-v27-candidate/cast.test.mjs
      - name: Reject production D1, Worker or public previews in staging configs
        run: node --test anytv-resolver/cast-v27-candidate/staging-config.test.mjs
      - name: Check prospective staging config only when explicitly provided
        env:
          STAGING_CONFIG_PATH: ${{ vars.ANYTV_CAST_STAGING_CONFIG_PATH }}
        run: |
          if [ -n "$STAGING_CONFIG_PATH" ]; then
            node anytv-resolver/cast-v27-candidate/check-staging-config.mjs "$STAGING_CONFIG_PATH"
          else
            echo 'STAGING_CONFIG_NOT_PROVISIONED; unit negative tests still enforced; deployment forbidden'
          fi
      - name: Confirm no deployment and no credentials
        run: echo 'CAST_V27_OFFLINE_ONLY; no Cloudflare deploy, no signature, no APK or OTA write.'
