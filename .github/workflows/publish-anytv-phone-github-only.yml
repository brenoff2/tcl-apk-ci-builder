name: AnyTV | Publicador oficial Android cert2026
# Release changes execute only after a separately reviewed, versioned intent
# commit. Editing this workflow itself must never publish an APK.
on:
  push:
    branches: [feat/tcl-v22-updates-back-bluetooth]
    paths:
      - .github/anytv-phone-release-request.json
permissions:
  actions: read
  contents: write
concurrency:
  group: anytv-android-cert2026-ota
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVERY_HEX: ${{ secrets.ANYTV_RECOVERY_SECRET_2026 }}
      EXPECTED_CERT: 2f14e43f7653a75f878c4d59a4a8ad462ade17c52bde23e802c8c6ed43ade95f
      APK_PACKAGE: com.tclremote.livre
    steps:
      - name: Checkout official phone OTA
        uses: actions/checkout@v4
        with:
          ref: feat/tcl-v22-updates-back-bluetooth
          fetch-depth: 0

      - name: Confirm explicit release request and original signer credential
        shell: bash
        run: |
          set -euo pipefail
          test -s signing-recovery/ANYTV_SIGNING_BACKUP_2026_ENCRYPTED.bin
          REQUEST=.github/anytv-phone-release-request.json
          test -s "$REQUEST"
          jq -e '
            .schema == 1 and
            .intent == "publish-cert2026-phone" and
            (.candidate_run_id | type == "string" and test("^[1-9][0-9]*$")) and
            (.expected_version_code | type == "number" and . == floor and . > 0)
          ' "$REQUEST" >/dev/null || { echo "::error::Invalid reviewed release request. OTA unchanged."; exit 1; }
          SOURCE_RUN_ID="$(jq -r .candidate_run_id "$REQUEST")"
          EXPECTED_CODE="$(jq -r .expected_version_code "$REQUEST")"
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
          echo "EXPECTED_CODE=$EXPECTED_CODE" >> "$GITHUB_ENV"
          if [[ ! "${RECOVERY_HEX:-}" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Repository Actions secret ANYTV_RECOVERY_SECRET_2026 missing or invalid. OTA unchanged."
            exit 1
          fi
          echo "Release intent accepted for CI run $SOURCE_RUN_ID; credential is available"

      - name: Download one validated source artifact from GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/brenoff2/tcl-apk-ci-builder/actions/runs/$SOURCE_RUN_ID")"
          echo "$RUN" | jq -e '
            .conclusion == "success" and
            .head_branch == "feat/anytv-p0-device-proof-verifier-20261020" and
            (.path | startswith(".github/workflows/anytv-")) and
            (.path | endswith(".yml")) and
            (.event == "push" or .event == "workflow_dispatch")
          ' >/dev/null
          gh api "repos/brenoff2/tcl-apk-ci-builder/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > artifacts.json
          ARTIFACT_NAME="$(jq -r '.artifacts[] | select(.expired == false) | .name | select(test("^anytv-.*-unsigned-audit$"))' artifacts.json)"
          [[ -n "$ARTIFACT_NAME" && "$ARTIFACT_NAME" != *$'\n'* ]] || { echo "::error::Expected exactly one unexpired unsigned candidate artifact"; exit 1; }
          mkdir -p incoming signed
          gh run download "$SOURCE_RUN_ID" --name "$ARTIFACT_NAME" --dir incoming
          mapfile -t APK_FILES < <(find incoming -type f -name '*_RELEASE_UNSIGNED.apk')
          test "${#APK_FILES[@]}" -eq 1
          APK="${APK_FILES[0]}"
          test -s incoming/SHA256.txt
          SOURCE_HASH="$(cut -d' ' -f1 incoming/SHA256.txt)"
          [[ "$SOURCE_HASH" =~ ^[a-f0-9]{64}$ ]] || exit 1
          echo "$SOURCE_HASH  $APK" | sha256sum -c -
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "SOURCE_SHA256=$SOURCE_HASH" >> "$GITHUB_ENV"
          echo "CI run: $SOURCE_RUN_ID, verified artifact: $ARTIFACT_NAME"

      - uses: android-actions/setup-android@v4
      - name: Prepare official Android signing tools
        run: sdkmanager 'build-tools;36.0.0'

      - name: Recover original signer and sign without exporting secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -m pip install -q 'cryptography>=43,<47'
          mkdir -m 700 -p signing-private
          trap 'rm -rf signing-private' EXIT
          python3 - <<'PY'
          import io,os,pathlib,zipfile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          b=pathlib.Path('signing-recovery/ANYTV_SIGNING_BACKUP_2026_ENCRYPTED.bin').read_bytes()
          if b[:9]!=b'ANYTVAES1':
              raise RuntimeError('Unrecognized encrypted signer backup')
          key=bytes.fromhex(os.environ['RECOVERY_HEX'])
          data=AESGCM(key).decrypt(b[9:21],b[21:],None)
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for name in ('anytv-phone-migration.p12','phone.password'):
                  target=pathlib.Path('signing-private')/name
                  target.write_bytes(archive.read(name))
                  target.chmod(0o600)
          print('cert2026 backup opened inside runner only')
          PY
          export PHONE_PASSWORD
          PHONE_PASSWORD="$(cat signing-private/phone.password)"
          echo "::add-mask::$PHONE_PASSWORD"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" sign --ks signing-private/anytv-phone-migration.p12 --ks-type PKCS12 \
            --ks-pass env:PHONE_PASSWORD --key-pass env:PHONE_PASSWORD \
            --out signed/AnyTV_CERT2026.apk "$APK_PATH"
          "$BT/apksigner" verify --verbose --print-certs signed/AnyTV_CERT2026.apk > signed/verify.txt
          grep -qx 'Verifies' signed/verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' signed/verify.txt
          grep -qi "$EXPECTED_CERT" signed/verify.txt
          "$BT/zipalign" -c 4 signed/AnyTV_CERT2026.apk

      - name: Enforce package, monotonic version and unchanged signer
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          NEW_BADGING="$("$BT/aapt" dump badging signed/AnyTV_CERT2026.apk)"
          OLD_BADGING="$("$BT/aapt" dump badging updates/android/cert2026/current.apk)"
          echo "$NEW_BADGING" | grep -q "package: name='$APK_PACKAGE'"
          echo "$OLD_BADGING" | grep -q "package: name='$APK_PACKAGE'"
          NEW_CODE="$(echo "$NEW_BADGING" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -1)"
          OLD_CODE="$(echo "$OLD_BADGING" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -1)"
          [[ "$NEW_CODE" =~ ^[0-9]+$ && "$OLD_CODE" =~ ^[0-9]+$ ]]
          (( NEW_CODE > OLD_CODE ))
          [[ "$NEW_CODE" == "$EXPECTED_CODE" ]] || { echo "::error::Candidate versionCode differs from approved request. OTA unchanged."; exit 1; }
          "$BT/apksigner" verify --print-certs updates/android/cert2026/current.apk > existing-verify.txt
          grep -qi "$EXPECTED_CERT" existing-verify.txt
          echo "Upgrade candidate versionCode=$NEW_CODE from $OLD_CODE"
          sha256sum signed/AnyTV_CERT2026.apk

      - name: Publish ONLY signed Android phone OTA
        shell: bash
        run: |
          set -euo pipefail
          cp signed/AnyTV_CERT2026.apk updates/android/cert2026/current.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f updates/android/cert2026/current.apk
          git diff --cached --check
          git commit -m "release(anytv): verified cert2026 Android phone OTA [skip ci]"
          git push origin HEAD:feat/tcl-v22-updates-back-bluetooth

      - name: Verify published APK byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(sha256sum signed/AnyTV_CERT2026.apk | cut -d ' ' -f1)"
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL --retry 2 "https://raw.githubusercontent.com/brenoff2/tcl-apk-ci-builder/feat/tcl-v22-updates-back-bluetooth/updates/android/cert2026/current.apk?check=$attempt" -o downloaded.apk || true
            if test -s downloaded.apk && cmp -s downloaded.apk signed/AnyTV_CERT2026.apk; then
              echo "$EXPECTED_SHA  downloaded.apk" | sha256sum -c -
              echo 'ANYTV_GITHUB_ONLY_CERT2026_OTA_READBACK_OK'
              exit 0
            fi
            sleep 10
          done
          echo "::error::OTA readback mismatch"
          exit 1
