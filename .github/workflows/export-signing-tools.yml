name: Export Android APK signer for local secure signing
on:
  push:
    branches: ['feat/android-apk-no-ads']
    paths: ['.github/workflows/export-signing-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: android-actions/setup-android@v4
      - name: Install build tools
        run: sdkmanager 'build-tools;36.0.0'
      - name: Extract official apksigner
        run: |
          mkdir -p output
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" output/apksigner.jar
          ls -lh output/apksigner.jar
          java -jar output/apksigner.jar --version
      - uses: actions/upload-artifact@v4
        with:
          name: android-official-apksigner
          path: output/apksigner.jar
          retention-days: 15
