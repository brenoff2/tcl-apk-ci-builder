name: Publish signed AnyTV Android 2.8
on:
  push:
    branches: ['feat/tcl-v22-updates-back-bluetooth']
    paths: ['.github/workflows/publish-anytv-28.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tcl-v22-updates-back-bluetooth
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Assert exact successful source build and no existing 2.8 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/runs/38672036441 --jq .conclusion)" = success
          test "$(gh api repos/${{ github.repository }}/commits/6029abd3c9730bf24a8aec18cdca0919cf426637 --jq .sha)" = 6029abd3c9730bf24a8aec18cdca0919cf426637
          if gh release view tcl-phone-v2.8 >/dev/null 2>&1; then
            echo 'A v2.8 release already exists, refusing overwrite'; exit 1
          fi
          echo '66f76ba5f486c9d91d954c75b7d27358399e7a18e775ef9e3546e07286d888cc  updates/android/current.apk' | sha256sum --check
          cmp updates/android/current.apk updates/android/AnyTV-v2.7.apk
      - name: Download and verify original-signed 2.8 APK
        env:
          SIGNED_SOURCE: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-c808-820e-8284-b5c471920a49/raw?se=2026-10-15T04%3A34%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=abc3fa24-3efa-5ae4-8b04-3e108ee19024&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T13%3A31%3A45Z&ske=2026-10-15T13%3A31%3A45Z&sks=b&skv=2026-02-06&sig=GgxW5sYL30IrKEhuB8FoKFFCLE5NSARXqLjZqONiREI%3D'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 "$SIGNED_SOURCE" -o output/AnyTV-2.8.apk
          echo 'af9c615a0f3d27e0026991f7330feb7b9de58cac139d91135ebe07cb071b073f  output/AnyTV-2.8.apk' | sha256sum --check
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/aapt" dump badging output/AnyTV-2.8.apk | grep -q "name='com.tclremote.livre' versionCode='28' versionName='2.8-AnyTV'"
          "$bt/apksigner" verify --verbose --print-certs output/AnyTV-2.8.apk > output/cert.txt
          grep -qi 'df72977485e8e5243048a7f1e8dff9fedcf2295161c4daae3834b6a16cd4e4c8' output/cert.txt
          "$bt/zipalign" -c 4 output/AnyTV-2.8.apk
      - name: Publish historical version and current update channel
        shell: bash
        run: |
          set -euo pipefail
          cp output/AnyTV-2.8.apk updates/android/AnyTV-v2.8.apk
          cp output/AnyTV-2.8.apk updates/android/current.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f updates/android/current.apk updates/android/AnyTV-v2.8.apk
          git diff --cached --quiet && { echo 'No publish changes'; exit 1; }
          git commit -m "release(android): signed AnyTV 2.8 streaming screens [skip ci]"
          git push
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp output/AnyTV-2.8.apk Controle_TCL_Livre_v2.8.apk
          gh release create tcl-phone-v2.8 Controle_TCL_Livre_v2.8.apk --target feat/tcl-v22-updates-back-bluetooth --title "AnyTV Android 2.8" --notes "Telas nativas de streaming por aplicativo instalado, catálogo brasileiro opcional TMDB/JustWatch e abertura no AnyTV Connect. Atualização assinada com certificado original. Disponibilidade e navegação variam por serviço."
      - name: Verify release and update channel byte equality
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/release
          gh release download tcl-phone-v2.8 -p Controle_TCL_Livre_v2.8.apk -D output/release
          echo 'af9c615a0f3d27e0026991f7330feb7b9de58cac139d91135ebe07cb071b073f  output/release/Controle_TCL_Livre_v2.8.apk' | sha256sum --check
          cmp output/AnyTV-2.8.apk updates/android/current.apk
          cmp output/AnyTV-2.8.apk updates/android/AnyTV-v2.8.apk
          cmp output/AnyTV-2.8.apk output/release/Controle_TCL_Livre_v2.8.apk
          echo ANYTV_28_CURRENT_AND_RELEASE_PUBLISHED_VERIFIED
