name: AnyTV V2 | Publish verified LG code103 signed artifact to OTA (one-shot)
on:
  push:
    branches: ['feat/anytv-p0-device-proof-verifier-20261020']
    paths: ['.github/workflows/anytv-lg-code103-ota-publish.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: anytv-phone-v2-new-package-release
  cancel-in-progress: false
jobs:
  publish-exact-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Validate signed QA source run and artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/brenoff2/tcl-apk-ci-builder/actions/runs/42933256692 > /tmp/anytv-run.json
          jq -e '.id == 42933256692 and .status == "completed" and .conclusion == "success" and .event == "push" and .head_branch == "feat/anytv-p0-device-proof-verifier-20261020" and .head_sha == "bd165bc66e4f15cb566d52fdef505c6080c9c87b"' /tmp/anytv-run.json >/dev/null
          gh api repos/brenoff2/tcl-apk-ci-builder/actions/artifacts/13816782508 > /tmp/anytv-artifact.json
          jq -e '.id == 13816782508 and .name == "anytv-lg-code103-signed-candidate" and .expired == false and .digest == "sha256:d5d3babbeabe18bbc4f77d61bf912827c0d22f0fbe4f806b1d2cd21fed7a4e5c" and .workflow_run.id == 42933256692' /tmp/anytv-artifact.json >/dev/null
          echo ANYTV_CODE103_SOURCE_RUN_AND_ARTIFACT_VERIFIED
      - name: Download exact signed code103 (no rebuild or resign)
        uses: actions/download-artifact@v4
        with:
          run-id: 42933256692
          name: anytv-lg-code103-signed-candidate
          github-token: ${{ github.token }}
          path: signed-proof
      - name: Verify signed APK SHA-256, package, version and original V2 certificate
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK="signed-proof/AnyTV_LG_2.9.75_code103_SIGNED_CANDIDATE.apk"
          test -s "$APK"
          test "$(find signed-proof -type f -name '*.apk' | wc -l)" -eq 1
          test "$(sha256sum "$APK" | cut -d' ' -f1)" = "a876bd5a929b77fdf29b6e95d13741a012d3137d85fccd1c8abcc44d4b137f51"
          test "$(awk 'NF {print $1; exit}' signed-proof/SHA256.txt)" = "a876bd5a929b77fdf29b6e95d13741a012d3137d85fccd1c8abcc44d4b137f51"
          "$BT/aapt" dump badging "$APK" > /tmp/anytv-code103-badging.txt
          grep -q "name='com.tclremote.livre.v2' versionCode='103'" /tmp/anytv-code103-badging.txt
          grep -q "versionName='2.9.75-AnyTV'" /tmp/anytv-code103-badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" > /tmp/anytv-code103-cert.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/anytv-code103-cert.txt
          grep -qi 'fe8c59e4f656af52f89e4430f7ba552aded37beb808a7e9953f534c5ebfe56d9' /tmp/anytv-code103-cert.txt
          "$BT/zipalign" -c 4 "$APK"
          echo ANYTV_CODE103_SIGNED_IDENTITY_AND_HASH_VERIFIED
      - name: Publish only V2 current.apk, with immutable old-HEAD and version gates
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="feat/tcl-v22-updates-back-bluetooth"
          EXPECTED_OLD_HEAD="c52395b67c6fd56777852ea09131e9fcf507617f"
          APK="signed-proof/AnyTV_LG_2.9.75_code103_SIGNED_CANDIDATE.apk"
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$BRANCH")" = "$EXPECTED_OLD_HEAD"
          git worktree add --detach ota-v2 "refs/remotes/origin/$BRANCH"
          test -s ota-v2/updates/android/v2/current.apk
          test -s ota-v2/updates/android/cert2026/current.apk
          OLD_CODE="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging ota-v2/updates/android/v2/current.apk | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -1)"
          test "$OLD_CODE" = "102"
          LEGACY_BEFORE="$(git -C ota-v2 rev-parse HEAD:updates/android/cert2026/current.apk)"
          test "$LEGACY_BEFORE" = "44c766b433ddb370f4589b87843f1edfd9cd7b7a"
          cp "$APK" ota-v2/updates/android/v2/current.apk
          git -C ota-v2 config user.name "github-actions[bot]"
          git -C ota-v2 config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C ota-v2 add -f updates/android/v2/current.apk
          test "$(git -C ota-v2 diff --cached --name-only)" = "updates/android/v2/current.apk"
          git -C ota-v2 diff --cached --check
          git -C ota-v2 commit -m "release(anytv-v2): publish verified signed LG 2.9.75 code103 OTA"
          RELEASE_COMMIT="$(git -C ota-v2 rev-parse HEAD)"
          test "$(git -C ota-v2 rev-parse HEAD:updates/android/cert2026/current.apk)" = "$LEGACY_BEFORE"
          git -C ota-v2 push origin "HEAD:refs/heads/$BRANCH"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$RELEASE_COMMIT"
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "ANYTV_CODE103_OTA_PUSH_AND_LEGACY_PRESERVATION_PASS $RELEASE_COMMIT"
      - name: Read back published OTA exact bytes and signer
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="${{ steps.publish.outputs.release_commit }}"
          URL="https://raw.githubusercontent.com/brenoff2/tcl-apk-ci-builder/$COMMIT/updates/android/v2/current.apk"
          curl --fail --location --silent --show-error --retry 3 "$URL" -o /tmp/anytv-v2-code103-remote.apk
          test "$(sha256sum /tmp/anytv-v2-code103-remote.apk | cut -d' ' -f1)" = "a876bd5a929b77fdf29b6e95d13741a012d3137d85fccd1c8abcc44d4b137f51"
          cmp /tmp/anytv-v2-code103-remote.apk signed-proof/AnyTV_LG_2.9.75_code103_SIGNED_CANDIDATE.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs /tmp/anytv-v2-code103-remote.apk | grep -qi 'fe8c59e4f656af52f89e4430f7ba552aded37beb808a7e9953f534c5ebfe56d9'
          echo "ANYTV_V2_GITHUB_OTA_BYTE_READBACK_SUCCESS"
          echo "ANYTV_LG_CODE103_2_9_75_PUBLISHED_WITHOUT_PHYSICAL_QA"
