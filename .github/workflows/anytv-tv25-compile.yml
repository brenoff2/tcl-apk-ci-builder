name: AnyTV Connect 2.5 cert2026 unsigned TV build
on:
  push:
    branches: ['feat/anytv-p0-device-proof-verifier-20261020']
    paths: ['.github/workflows/anytv-tv25-compile.yml', 'overrides/tv_safe/TvAppBridge.java', 'scripts/tests/test_safe_tv_companion.py', 'scripts/prepare_companion_safe.py', 'assets/anytv_icon.png', 'assets/anytv_logo.png']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tv-update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Clonar fonte MIT fixada e preparar TV 2.1
        run: |
          git clone --depth 1 https://github.com/fezdk/bluetooth-quick-connect.git tv-source
          test "$(git -C tv-source rev-parse HEAD)" = "508b5f148e1945911085f1789051c59d76c0278b"
          python3 scripts/prepare_companion_safe.py
      - name: Bump migration patch version (preserve same signing identity)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tv-source/app/build.gradle.kts')
          s=p.read_text()
          assert s.count('versionCode = 13') == 1
          assert s.count('versionName = "2.2-AnyTV"') == 1
          p.write_text(s.replace('versionCode = 13','versionCode = 16').replace('versionName = "2.2-AnyTV"','versionName = "2.5-AnyTV"'))
          PY
      - name: Validate replacement signer updater routing (TV)
        run: |
          set -euo pipefail
          cmp overrides/common/TclUpdateManager.java tv-source/app/src/main/java/tcl/shared/TclUpdateManager.java
          grep -q '2f14e43f7653a75f878c4d59a4a8ad462ade17c52bde23e802c8c6ed43ade95f' tv-source/app/src/main/java/tcl/shared/TclUpdateManager.java
          grep -q '0a5427237a2445c42520236469563dabceda6d43310fe4e6aea6af8ddffc223c' tv-source/app/src/main/java/tcl/shared/TclUpdateManager.java
          grep -q 'suffix = "android/cert2026"' tv-source/app/src/main/java/tcl/shared/TclUpdateManager.java
          grep -q 'suffix = "tv/cert2026"' tv-source/app/src/main/java/tcl/shared/TclUpdateManager.java
      - name: Auditar fonte e permissoes
        env:
          TCL_TV_V14: '1'
          TCL_TV_V15: '1'
          TCL_TV_V16: '1'
          TCL_TV_V21: '1'
          TCL_TV_V22: '1'
          TCL_TV_V25: '1'
          TCL_TV_V24: '1'
          TCL_TV_V23: '1'
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_safe_tv_companion.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_tcl_v22_contract.py' -k TvUpdateAndBluetooth -v
      - name: Validate approved TV launcher icon and black banner
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          original = Image.open("assets/anytv_icon.png").convert("RGBA")
          original.thumbnail((432, 432), Image.Resampling.LANCZOS)
          deployed = Image.open("tv-source/app/src/main/res/drawable/tcl_icon.png").convert("RGBA")
          assert original.size == deployed.size
          assert original.tobytes() == deployed.tobytes(), "TV launcher icon differs from approved artwork"
          banner = Image.open("tv-source/app/src/main/res/drawable/tcl_banner.png").convert("RGBA")
          assert banner.size == (640, 360)
          assert banner.getpixel((0, 0)) == (0, 0, 0, 255), "TV banner contains stale background"
          manifest = Path("tv-source/app/src/main/AndroidManifest.xml").read_text()
          assert 'android:icon="@drawable/tcl_icon"' in manifest
          assert 'android:banner="@drawable/tcl_banner"' in manifest
          print("ANYTV_TV_BRAND_ASSETS_VERIFIED")
          PY
      - name: Compilar release TV
        run: |
          cd tv-source
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verificar pacote e permissoes (sem Acessibilidade)
        run: |
          set -euo pipefail
          mkdir -p output
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=tv-source/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/aapt" dump badging "$APK" > output/identidade.txt
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml > output/manifesto.txt
          "$BT/aapt" dump permissions "$APK" > output/permissoes.txt
          grep -q "name='com.tclremote.tvcompanion' versionCode='16'" output/identidade.txt
          if grep -Ei 'BIND_ACCESSIBILITY_SERVICE|AccessibilityService|QUERY_ALL_PACKAGES|SYSTEM_ALERT_WINDOW|android.permission.BLUETOOTH_SCAN' output/permissoes.txt output/manifesto.txt; then
            echo 'PERMISSAO SENSIVEL NA TV'; exit 1
          fi
          "$BT/zipalign" -f 4 "$APK" output/AnyTV_TV_2_5_RELEASE_UNSIGNED.apk
          "$BT/zipalign" -c 4 output/AnyTV_TV_2_5_RELEASE_UNSIGNED.apk
          sha256sum output/AnyTV_TV_2_5_RELEASE_UNSIGNED.apk > output/SHA256.txt
          echo 'NAO INSTALAR. Gerar versoes assinadas com ambos certificados TV 1.3.' > output/LEIA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: anytv-tv25-unsigned-audit
          path: output/
          retention-days: 30
          if-no-files-found: error

