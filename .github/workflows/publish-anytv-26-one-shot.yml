name: Publish verified signed AnyTV Android 2.6
on:
  push:
    branches: ['feat/tcl-v22-updates-back-bluetooth']
    paths: ['.github/workflows/publish-anytv-26-one-shot.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tcl-v22-updates-back-bluetooth
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Verify signed 2.6 package and certificate
        shell: bash
        env:
          SIGNED_APK: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-f1ec-820e-97a9-4c054c8baec2/raw?se=2026-10-15T00%3A20%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=48951f5f-e33b-5d76-bd05-845b9fc24568&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T11%3A15%3A59Z&ske=2026-10-15T11%3A15%3A59Z&sks=b&skv=2026-02-06&sig=uHtOvKdCGXXUsLu4WiFLrfQ6sTsI7UyPQEWZVMkNBNA%3D'
        run: |
          set -euo pipefail
          mkdir -p staging
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 240 "$SIGNED_APK" -o staging/AnyTV-2.6.apk
          echo 'a3c8ec9dfad9b4ada80d81c49fdcda32f146b0b9a7720204d4048a70a4ce529e  staging/AnyTV-2.6.apk' | sha256sum -c
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/aapt" dump badging staging/AnyTV-2.6.apk | grep -q "name='com.tclremote.livre' versionCode='26' versionName='2.6-AnyTV'"
          "$bt/apksigner" verify --verbose --print-certs staging/AnyTV-2.6.apk > staging/verification.txt
          grep -qi 'df72977485e8e5243048a7f1e8dff9fedcf2295161c4daae3834b6a16cd4e4c8' staging/verification.txt
          "$bt/zipalign" -c 4 staging/AnyTV-2.6.apk
          echo 'ANYTV_26_CERT_AND_VERSION_VERIFIED'
      - name: Publish official current.apk and immutable history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p updates/android
          cp staging/AnyTV-2.6.apk updates/android/current.apk
          cp staging/AnyTV-2.6.apk updates/android/AnyTV-v2.6.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f updates/android/current.apk updates/android/AnyTV-v2.6.apk
          if ! git diff --cached --quiet; then
            git commit -m "release(android): publish AnyTV 2.6 verified signed APK [skip ci]"
            git push
          fi
      - name: Publish release for earlier updater versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cp staging/AnyTV-2.6.apk Controle_TCL_Livre_v2.6.apk
          if gh release view tcl-phone-v2.6 >/dev/null 2>&1; then
            gh release upload tcl-phone-v2.6 Controle_TCL_Livre_v2.6.apk --clobber
          else
            gh release create tcl-phone-v2.6 Controle_TCL_Livre_v2.6.apk --target feat/tcl-v22-updates-back-bluetooth --title "AnyTV Android 2.6" --notes "Centralizacao do controle, botao OK menor, splash oficial AnyTV com versao e editor de texto com envio explicito."
          fi
      - name: Verify exact release SHA-256 and current APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/release
          gh release download tcl-phone-v2.6 -p Controle_TCL_Livre_v2.6.apk -D staging/release
          echo 'a3c8ec9dfad9b4ada80d81c49fdcda32f146b0b9a7720204d4048a70a4ce529e  staging/release/Controle_TCL_Livre_v2.6.apk' | sha256sum -c
          cmp staging/AnyTV-2.6.apk staging/release/Controle_TCL_Livre_v2.6.apk
          cmp staging/AnyTV-2.6.apk updates/android/current.apk
          echo 'ANYTV_26_RELEASE_PUBLISHED_AND_VERIFIED'
