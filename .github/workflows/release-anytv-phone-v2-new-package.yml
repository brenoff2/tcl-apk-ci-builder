name: AnyTV V2 | Atualização oficial do aplicativo (sem alterar cert2026)

on:
  push:
    branches: ['feat/anytv-p0-device-proof-verifier-20261020']
    paths: ['.github/anytv-phone-v2-build-request.json']
permissions:
  contents: write

concurrency:
  group: anytv-phone-v2-new-package-release
  cancel-in-progress: false

jobs:
  phone-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Enforce V2 release authorization and encrypted signer material
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema == 1 and .intent == "release-independent-phone-v2" and .expected_version_code == 61 and .preserve_legacy_ota == true' .github/anytv-phone-v2-build-request.json >/dev/null
          test -s signing-recovery/v2/phone-signer.aesgcm
          test -s signing-recovery/v2/phone-cert.pem
          test -s signing-recovery/v2/identity.json
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Clonar fonte Android TV Remote 2 Apache-2.0 fixada
        run: |
          git clone --depth 1 https://github.com/harimoradiya/androidtvremote.git source
          test "$(git -C source rev-parse HEAD)" = "16c68f0bb9d23f929ee8240f105fdb9000262d85"
      - name: Preparar app e aplicar versoes v2.0 -> v2.1 -> v2.2
        run: |
          TCL_RESCUE_STABLE=1 TCL_APPROVED_UI=1 TCL_RELEASE_SINGLE_APP=1 python3 scripts/prepare_tcl.py
          python3 scripts/apply_tcl_v21.py
          python3 scripts/apply_tcl_v22.py
          python3 scripts/apply_tcl_ptbr_cleanup.py
          python3 scripts/apply_tcl_i18n.py
          # V2 shows connected TV name automatically; legacy manual brand picker is obsolete.
          python3 scripts/apply_tcl_sticky_controls.py
          python3 scripts/apply_anytv_brand.py
          python3 scripts/apply_anytv_tv_tls_alias_isolation.py
          python3 scripts/apply_anytv_restore_connection.py
          python3 scripts/apply_anytv_premiere_reminder_manifest.py
          python3 -c 'import pathlib, xml.etree.ElementTree as ET; files=list(pathlib.Path("source/app/src/main/res").glob("values*/tcl_localization.xml")); assert len(files)==16, len(files); [ET.parse(p) for p in files]; print("TCL_I18N_XML_VALID",len(files))'
      - name: Bump migration patch version (preserve same signing identity)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/app/build.gradle.kts')
          s=p.read_text()
          assert s.count('versionCode = 34') == 1
          assert s.count('versionName = "2.9.5-AnyTV"') == 1
          p.write_text(s.replace('versionCode = 34','versionCode = 39').replace('versionName = "2.9.5-AnyTV"','versionName = "2.9.10-AnyTV"'))
          PY
      - name: Validate replacement signer updater routing (phone)
        run: |
          set -euo pipefail
          cmp overrides/common/TclUpdateManager.java source/app/src/main/java/tcl/shared/TclUpdateManager.java
          grep -q '2f14e43f7653a75f878c4d59a4a8ad462ade17c52bde23e802c8c6ed43ade95f' source/app/src/main/java/tcl/shared/TclUpdateManager.java
          grep -q '0a5427237a2445c42520236469563dabceda6d43310fe4e6aea6af8ddffc223c' source/app/src/main/java/tcl/shared/TclUpdateManager.java
          grep -q 'suffix = "android/cert2026"' source/app/src/main/java/tcl/shared/TclUpdateManager.java
          grep -q 'suffix = "tv/cert2026"' source/app/src/main/java/tcl/shared/TclUpdateManager.java
      - name: Validar regressao e atualizacao segura (versionCode 39, updater v2.2)
        env:
          TCL_APPROVED_UI: '1'
          TCL_RELEASE_SINGLE_APP: '1'
          TCL_V21: '1'
          TCL_V22: '1'
          TCL_V23: '1'
          TCL_V24: '1'
          TCL_V25: '1'
          TCL_V26: '1'
          TCL_V27: '1'
          TCL_V28: '1'
          TCL_V29: '1'
          TCL_V30: '1'
          TCL_V33: '1'
          TCL_V34: '1'
          TCL_V39: '1'
          TCL_V37: '1'
          TCL_V36: '1'
          TCL_V35: '1'
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_rescue_contract.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_approved_visual_contract.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_anytv_auto_tv_resume.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_tcl_v21_contract.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_tcl_v22_contract.py' -k PhoneUpdatesAndBack -v
      - name: Impedir entrega com tokens manuais no Streaming (gate P0)
        run: python3 -m unittest discover -s scripts/tests -p 'test_streaming_no_manual_credentials.py' -v
      - name: Validar telas de streaming reais (versionCode 39)
        env:
          TCL_V39: '1'
          TCL_V37: '1'
          TCL_V36: '1'
          TCL_V35: '1'
        run: python3 -m unittest discover -s scripts/tests -p 'test_streaming_screens_contract.py' -v
      - name: Validar troca opt-in de endpoint somente em staging
        run: python3 -m unittest discover -s scripts/tests -p 'test_anytv_staging_endpoint.py' -v
      - name: Versionar nova atualização como AnyTV V2 2.9.32 (code 61)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/app/build.gradle.kts')
          s=p.read_text()
          assert s.count('versionCode = 39') == 1
          assert s.count('versionName = "2.9.10-AnyTV"') == 1
          p.write_text(s.replace('versionCode = 39','versionCode = 61').replace('versionName = "2.9.10-AnyTV"','versionName = "2.9.32-AnyTV"'))
          PY
      - name: Gate - restaurar literalmente codigo de conexao validado na 2.9.8
        run: |
          set -euo pipefail
          test ! -e source/app/src/main/java/com/hari/androidtvremote/androidLib/TlsRepair.java
          ! grep -q 'A TV precisa de novo pareamento' source/app/src/main/java/com/hari/androidtvremote/ui/app/TvRemoteViewModel.kt
          grep -q 'SSL certificate error. Re-pair the device.' source/app/src/main/java/com/hari/androidtvremote/androidLib/AndroidRemoteTv.java
          grep -q 'mPairingSession.pair(host, 6467' source/app/src/main/java/com/hari/androidtvremote/androidLib/AndroidRemoteTv.java
          grep -q 'mRemoteSession = new RemoteSession(host, 6466' source/app/src/main/java/com/hari/androidtvremote/androidLib/AndroidRemoteTv.java
          grep -q 'RESOLVER_BASE = "https://anytv-link-resolver-pilot.brenoff.workers.dev"' source/app/src/main/java/com/hari/androidtvremote/ui/app/AnyTvDeviceIdentity.kt
          echo 'ANYTV_298_CONNECTION_CODE_RESTORED_NO_SSL_PATCH'
      - name: Testar identidade RSA isolada e ausencia de mutacao de chaves
        run: python3 -m unittest discover -s scripts/tests -p 'test_anytv_tv_tls_identity_isolation.py' -v
      - name: Adaptar SOMENTE app Android para pacote e OTA V2 com cert novo
        run: python3 scripts/apply_anytv_phone_v2_identity.py
      - name: Compilar release sem R8 agressivo
        run: |
          cd source
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Testar serializacao IME Remote v2 contra mensagens de referencia
        run: |
          cd source
          ./gradlew :app:testDebugUnitTest --tests 'com.hari.androidtvremote.androidLib.remote.RemoteImeWireTest' --no-daemon --stacktrace
      - name: Verificar busca global real TMDB filme e serie (sem falsos vazios)
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import urllib.error
          base = "https://anytv-link-resolver-pilot.brenoff.workers.dev/v1/catalog/"
          for kind, title in (("movie", "Titanic"), ("tv", "Breaking Bad")):
              query = urllib.parse.urlencode({"language": "pt-BR", "query": title})
              request = urllib.request.Request(
                  base + "search/" + kind + "?" + query,
                  headers={"Accept": "application/json", "User-Agent": "AnyTV/2.9.32 QA"})
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      assert response.status == 200, (kind, response.status)
                      body = json.load(response)
              except urllib.error.HTTPError as error:
                  diagnostic = error.read(400).decode("utf-8", errors="replace")
                  print("ANYTV_CATALOG_HTTP_DIAGNOSTIC", kind, error.code,
                        diagnostic[:180], flush=True)
                  # Catalog search is now independent of the JustWatch budget:
                  # any HTTP failure must block publication.
                  raise
              results = body.get("results", [])
              assert isinstance(results, list) and len(results) > 0, (kind, title)
              print("ANYTV_LIVE_GLOBAL_SEARCH_SUCCESS", kind, title, len(results))
          PY
      - name: Auditar APK e guardar release nao assinado
        run: |
          set -euo pipefail
          mkdir -p output
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=source/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/aapt" dump badging "$APK" > output/identidade.txt
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml > output/manifesto.txt
          grep -q "name='com.tclremote.livre.v2' versionCode='61'" output/identidade.txt
          ! grep -q 'com.tclremote.livre.preview' output/identidade.txt
          "$BT/zipalign" -f 4 "$APK" output/AnyTV_2_9_32_RELEASE_UNSIGNED.apk
          "$BT/zipalign" -c 4 output/AnyTV_2_9_32_RELEASE_UNSIGNED.apk
          sha256sum output/AnyTV_2_9_32_RELEASE_UNSIGNED.apk > output/SHA256.txt
          echo 'App AnyTV V2 separado: nao atualiza a instalacao antiga cert2026; preserva o AnyTV existente.' > output/LEIA.txt
      - name: Recover new V2 signer from encrypted GitHub backup and sign APK
        shell: bash
        env:
          V2_RECOVERY_HEX: ${{ secrets.ANYTV_SIGNER_V2_RECOVERY_HEX }}
        run: |
          set -euo pipefail
          python3 -m pip install -q 'cryptography==46.0.3'
          umask 077
          mkdir -m 700 -p signing-v2-private signed-v2
          trap 'rm -rf signing-v2-private' EXIT
          python3 - <<'PY'
          import base64,hashlib,hmac,json,os,pathlib
          from cryptography import x509
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.serialization import pkcs12
          k=os.environ.get('V2_RECOVERY_HEX','')
          if len(k)!=64 or any(c not in '0123456789abcdefABCDEF' for c in k):
              raise RuntimeError('New V2 recovery secret missing; no publish allowed')
          key=bytes.fromhex(k)
          root=pathlib.Path('signing-recovery/v2')
          ciphertext=(root/'phone-signer.aesgcm').read_bytes()
          meta=json.loads((root/'identity.json').read_text())
          assert ciphertext[:9]==b'ANYTVV2G1'
          assert hashlib.sha256(ciphertext).hexdigest()==meta['ciphertext_sha256']
          p12=AESGCM(key).decrypt(ciphertext[9:21],ciphertext[21:],None)
          pw=base64.urlsafe_b64encode(hmac.new(key,b'AnyTV-Phone-V2-PKCS12-Pass-v1',hashlib.sha256).digest())
          signer,cert,_=pkcs12.load_key_and_certificates(p12,pw)
          assert signer is not None
          assert cert.fingerprint(hashes.SHA256()).hex()==meta['certificate_sha256']
          (pathlib.Path('signing-v2-private')/'phone.p12').write_bytes(p12)
          (pathlib.Path('signing-v2-private')/'password').write_bytes(pw)
          print('ANYTV_V2_ENCRYPTED_BACKUP_RECOVERED_WITH_GITHUB_ACTIONS_SECRET')
          PY
          export P12_V2_PASSWORD
          P12_V2_PASSWORD="$(cat signing-v2-private/password)"
          echo "::add-mask::$P12_V2_PASSWORD"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks signing-v2-private/phone.p12 --ks-type PKCS12 \
            --ks-pass env:P12_V2_PASSWORD --key-pass env:P12_V2_PASSWORD \
            --out signed-v2/AnyTV_V2_2.9.32_UPDATE.apk output/AnyTV_2_9_32_RELEASE_UNSIGNED.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs signed-v2/AnyTV_V2_2.9.32_UPDATE.apk > signed-v2/audit.txt
          EXPECTED_CERT="$(jq -r .certificate_sha256 signing-recovery/v2/identity.json)"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' signed-v2/audit.txt
          grep -qi "$EXPECTED_CERT" signed-v2/audit.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c 4 signed-v2/AnyTV_V2_2.9.32_UPDATE.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging signed-v2/AnyTV_V2_2.9.32_UPDATE.apk > signed-v2/badging.txt
          grep -q "package: name='com.tclremote.livre.v2' versionCode='61'" signed-v2/badging.txt
          echo "ANYTV_V2_SIGNER_VALIDATED_$(sha256sum signed-v2/AnyTV_V2_2.9.32_UPDATE.apk | cut -d ' ' -f1)"
      - name: Publish V2 APK to independent GitHub channel, preserve old OTA
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/tcl-v22-updates-back-bluetooth
          git worktree add --detach ota-v2 origin/feat/tcl-v22-updates-back-bluetooth
          test -s ota-v2/updates/android/cert2026/current.apk
          if test -e ota-v2/updates/android/v2/current.apk; then
            oldcode="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging ota-v2/updates/android/v2/current.apk | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -1)"
            test -n "$oldcode" && test "$oldcode" -lt 61
          fi
          mkdir -p ota-v2/updates/android/v2
          cp signed-v2/AnyTV_V2_2.9.32_UPDATE.apk ota-v2/updates/android/v2/current.apk
          (cd ota-v2 && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add -f updates/android/v2/current.apk && git diff --cached --check && git commit -m 'release(anytv-v2): verified signed V2 2.9.32 OTA update' && git push origin HEAD:feat/tcl-v22-updates-back-bluetooth)
      - name: Verify published V2 APK bytes through GitHub HTTPS
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -fsSL --retry 2 "https://raw.githubusercontent.com/brenoff2/tcl-apk-ci-builder/feat/tcl-v22-updates-back-bluetooth/updates/android/v2/current.apk?check=$attempt" -o signed-v2/remote.apk || true
            if test -s signed-v2/remote.apk && cmp -s signed-v2/remote.apk signed-v2/AnyTV_V2_2.9.32_UPDATE.apk; then
              echo 'ANYTV_V2_GITHUB_OTA_BYTE_READBACK_SUCCESS'
              exit 0
            fi
            sleep 10
          done
          echo "::error::V2 remote readback failed"
          exit 1
      - name: Audit signed V2 app as independent artifact
        uses: actions/upload-artifact@v4
        with:
          name: anytv-v2-2932-signed-update
          path: |
            signed-v2/AnyTV_V2_2.9.32_UPDATE.apk
            signed-v2/badging.txt
          if-no-files-found: error
          retention-days: 30
