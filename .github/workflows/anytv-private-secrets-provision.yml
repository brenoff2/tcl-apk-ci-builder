name: AnyTV Cloudflare secret provisioning (manual, private)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anytv-private-secret-provision
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MOVIE_KEY: ${{ secrets.ANYTV_MOVIE_API_KEY }}
      TMDB_KEY: ${{ secrets.ANYTV_TMDB_READ_TOKEN }}
      CF_ACCOUNT_ID: 48172e80b82e7f0a2100e512831c48d2
      CF_WORKER: anytv-link-resolver-pilot
    steps:
      - name: Fail closed unless ALL credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo 'BLOCKED: Cloudflare token missing'; exit 1; }
          test -n "$MOVIE_KEY" || { echo 'BLOCKED: Movie of the Night secret missing'; exit 1; }
          test -n "$TMDB_KEY" || { echo 'BLOCKED: TMDB secret missing'; exit 1; }
          echo 'Private prerequisites present; credentials never displayed.'
      - name: Provision Worker secrets without command line arguments or logs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          account = os.environ['CF_ACCOUNT_ID']
          worker = os.environ['CF_WORKER']
          token = os.environ['CF_API_TOKEN']
          for key, value in [
              ('ANYTV_MOVIE_API_KEY', os.environ['MOVIE_KEY']),
              ('TMDB_READ_TOKEN', os.environ['TMDB_KEY']),
          ]:
              url = f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{worker}/secrets'
              data = json.dumps({'name': key, 'text': value, 'type': 'secret_text'}).encode()
              req = urllib.request.Request(url, data=data, method='PUT',
                  headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      payload = json.load(response)
              except Exception:
                  raise SystemExit('Secret provisioning failed for ' + key + ' (response suppressed)')
              if not payload.get('success'):
                  raise SystemExit('Secret provisioning rejected for ' + key + ' (response suppressed)')
              print(key + ': configured securely')
          PY
      - name: Read back only secret names; do not enable public route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          root = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT_ID']}/workers/scripts/{os.environ['CF_WORKER']}"
          headers = {'Authorization': 'Bearer ' + os.environ['CF_API_TOKEN']}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(root+path,headers=headers),timeout=20) as f:
                  return json.load(f)
          found = {x['name'] for x in get('/secrets')['result']}
          if not {'ANYTV_MOVIE_API_KEY','TMDB_READ_TOKEN'} <= found:
              raise SystemExit('BLOCKED: Worker secret readback incomplete')
          if get('/subdomain')['result'].get('enabled') is True:
              raise SystemExit('BLOCKED: Worker unexpectedly public')
          print('PRIVATE_WORKER_SECRETS_VERIFIED; public route remains disabled')
          PY
