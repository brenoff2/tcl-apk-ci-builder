name: Publish AnyTV 2.9.4 and Connect 2.1 BR rights and Prime GTI fixes
on:
  push:
    branches: ['feat/tcl-v22-updates-back-bluetooth']
    paths: ['.github/workflows/publish-anytv-br-prime-hotfix.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: anytv-294-21-regional-prime-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tcl-v22-updates-back-bluetooth
          fetch-depth: 0
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Verify prior successful integration and old update channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/runs/38765808433 --jq .conclusion)" = success
          test "$(gh api repos/${{ github.repository }}/actions/jobs/116528580038 --jq .conclusion)" = success
          test "$(gh api repos/${{ github.repository }}/releases/tags/tcl-phone-v2.9.3 --jq .tag_name)" = tcl-phone-v2.9.3
          test "$(gh api repos/${{ github.repository }}/releases/tags/tv-complemento-v2.0 --jq .tag_name)" = tv-complemento-v2.0
          ! gh release view tcl-phone-v2.9.4 >/dev/null 2>&1
          ! gh release view tv-complemento-v2.1 >/dev/null 2>&1
          echo 'd549be2c1a07bc7b6a7449300ac4bd5b07ebf760a723e55f8cf5bc5e2262f6bf  updates/android/current.apk' | sha256sum -c -
          echo '4abd79f5deae11ba79578e22bb7cdfea491ae8d953a294102ec4fbc5f90fdf20  updates/tv/cert8b2b/current.apk' | sha256sum -c -
          echo '9423c715d9c39d1ff8269370bce8ee8fe9fc96ec3ef0e149f5dc959d8d7a8cba  updates/tv/cert3382/current.apk' | sha256sum -c -
      - name: Download signed immutable release candidates
        env:
          SRC_PHONE: "https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-7f18-822f-939b-77f5ae855c36/raw?se=2026-10-15T16%3A30%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=677f3f74-e0d2-5498-8191-bdcda0560a1a&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T12%3A30%3A34Z&ske=2026-10-16T12%3A30%3A34Z&sks=b&skv=2026-02-06&sig=12PWIOKCZFl51yabDCYYyvOsTurGUah8XN9%2B3rSUx/E%3D"
          SRC_TV8: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-a0ec-8211-98e6-a3e56aa1a3e6/raw?se=2026-10-15T16%3A30%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=413fb05a-87ce-5be2-b8e7-394ba973261d&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T10%3A47%3A10Z&ske=2026-10-16T10%3A47%3A10Z&sks=b&skv=2026-02-06&sig=IK9YNtVCYNhKGZEIye%2BUHotDtO02TKkvOviuqFOYIOM%3D"
          SRC_TV3: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-e878-81f5-ac59-e9db0aa5d46f/raw?se=2026-10-15T16%3A30%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=6fff5ab2-a6de-54fa-80ef-a53ef2892e81&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T10%3A47%3A55Z&ske=2026-10-16T10%3A47%3A55Z&sks=b&skv=2026-02-06&sig=4HDFxXluPsKivaj0%2B0oYhvtqMGF7no2n5PMaXEShWQ4%3D"
        run: |
          set -euo pipefail
          mkdir -p signed
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 240 "$SRC_PHONE" -o signed/Controle_TCL_Livre_v2.9.4.apk
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 120 "$SRC_TV8" -o signed/Controle_TCL_TV_v2.1_cert8b2b.apk
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 120 "$SRC_TV3" -o signed/Controle_TCL_TV_v2.1_cert3382.apk
          echo '87f382c98127c1792f41d60e0f0baef754c61b137e545ff03b067736ca9c005a  signed/Controle_TCL_Livre_v2.9.4.apk' | sha256sum -c -
          echo 'b16fe96c3b7a59137b26a89c0cebfbd7cb70e96524374b4f56d27edbcd61f720  signed/Controle_TCL_TV_v2.1_cert8b2b.apk' | sha256sum -c -
          echo '2ac44b84fafb5663d610cbee45815732cb4b196bac050bae3831caa0a2ab224f  signed/Controle_TCL_TV_v2.1_cert3382.apk' | sha256sum -c -
      - name: Verify package name, version, original certificates and alignment
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          for item in 'phone Controle_TCL_Livre_v2.9.4.apk com.tclremote.livre 33 df72977485e8e5243048a7f1e8dff9fedcf2295161c4daae3834b6a16cd4e4c8' 'tv8 Controle_TCL_TV_v2.1_cert8b2b.apk com.tclremote.tvcompanion 12 8b2b0c6f2a7a668f9aae829be811241dc70c3697af2b3e6c71e1a1767a5d83da' 'tv3 Controle_TCL_TV_v2.1_cert3382.apk com.tclremote.tvcompanion 12 3382dfb12a0f16eb9167e056f947ea9740448fe07b8ef9d0ace0c889bf591add'; do
            read -r label name pkg ver cert <<< "$item"
            apk="signed/$name"
            "$BT/aapt" dump badging "$apk" | grep -q "name='$pkg' versionCode='$ver'"
            "$BT/apksigner" verify --verbose --print-certs "$apk" > "verify-$label.txt"
            grep -q '^Verifies$' "verify-$label.txt"
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "verify-$label.txt"
            grep -qi "$cert" "verify-$label.txt"
            "$BT/zipalign" -c 4 "$apk"
          done
      - name: Publish versioned releases and verify identical assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create tcl-phone-v2.9.4 signed/Controle_TCL_Livre_v2.9.4.apk --target feat/tcl-v22-updates-back-bluetooth --title 'AnyTV 2.9.4' --notes 'BR availability recheck before direct title URLs; keep search fallback during network failures. Requires Connect 2.1 for corrected Prime GTI deep links. Physical tests pending.' --latest=false
          gh release create tv-complemento-v2.1 signed/Controle_TCL_TV_v2.1_cert8b2b.apk signed/Controle_TCL_TV_v2.1_cert3382.apk --target feat/tcl-v22-updates-back-bluetooth --title 'AnyTV Connect 2.1' --notes 'Correct Prime Video GTI deep links and secure query validation, preserving paired TV, Bluetooth and catalogue. Provider-region playback must still be tested.' --latest=false
          mkdir -p release-phone release-tv
          gh release download tcl-phone-v2.9.4 -p '*.apk' -D release-phone
          gh release download tv-complemento-v2.1 -p '*.apk' -D release-tv
          cmp signed/Controle_TCL_Livre_v2.9.4.apk release-phone/Controle_TCL_Livre_v2.9.4.apk
          cmp signed/Controle_TCL_TV_v2.1_cert8b2b.apk release-tv/Controle_TCL_TV_v2.1_cert8b2b.apk
          cmp signed/Controle_TCL_TV_v2.1_cert3382.apk release-tv/Controle_TCL_TV_v2.1_cert3382.apk
      - name: Publish both versioned history and the CURRENT updater APKs
        run: |
          set -euo pipefail
          cp signed/Controle_TCL_Livre_v2.9.4.apk updates/android/AnyTV-v2.9.4.apk
          cp signed/Controle_TCL_Livre_v2.9.4.apk updates/android/current.apk
          cp signed/Controle_TCL_TV_v2.1_cert8b2b.apk updates/tv/cert8b2b/AnyTV-Connect-v2.1.apk
          cp signed/Controle_TCL_TV_v2.1_cert8b2b.apk updates/tv/cert8b2b/current.apk
          cp signed/Controle_TCL_TV_v2.1_cert3382.apk updates/tv/cert3382/AnyTV-Connect-v2.1.apk
          cp signed/Controle_TCL_TV_v2.1_cert3382.apk updates/tv/cert3382/current.apk
          cat > updates/android/current.json <<'JSON'
          {
            "schema": 1,
            "platform": "android",
            "package": "com.tclremote.livre",
            "available": true,
            "version": "2.9.4",
            "versionCode": 33,
            "tag": "tcl-phone-v2.9.4",
            "assets": [
              {
                "name": "Controle_TCL_Livre_v2.9.4.apk",
                "size": 28314468,
                "digest": "sha256:87f382c98127c1792f41d60e0f0baef754c61b137e545ff03b067736ca9c005a",
                "browser_download_url": "https://github.com/brenoff2/tcl-apk-ci-builder/releases/download/tcl-phone-v2.9.4/Controle_TCL_Livre_v2.9.4.apk"
              }
            ]
          }
          JSON
          cat > updates/tv/current.json <<'JSON'
          {
            "schema": 1,
            "platform": "tv",
            "package": "com.tclremote.tvcompanion",
            "available": true,
            "version": "2.1",
            "tag": "tv-complemento-v2.1",
            "assets": [
              {
                "name": "Controle_TCL_TV_v2.1_cert8b2b.apk",
                "size": 320191,
                "digest": "sha256:b16fe96c3b7a59137b26a89c0cebfbd7cb70e96524374b4f56d27edbcd61f720",
                "browser_download_url": "https://github.com/brenoff2/tcl-apk-ci-builder/releases/download/tv-complemento-v2.1/Controle_TCL_TV_v2.1_cert8b2b.apk"
              },
              {
                "name": "Controle_TCL_TV_v2.1_cert3382.apk",
                "size": 320191,
                "digest": "sha256:2ac44b84fafb5663d610cbee45815732cb4b196bac050bae3831caa0a2ab224f",
                "browser_download_url": "https://github.com/brenoff2/tcl-apk-ci-builder/releases/download/tv-complemento-v2.1/Controle_TCL_TV_v2.1_cert3382.apk"
              }
            ]
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f updates/android/current.apk updates/android/AnyTV-v2.9.4.apk updates/android/current.json updates/tv/cert8b2b/current.apk updates/tv/cert8b2b/AnyTV-Connect-v2.1.apk updates/tv/cert3382/current.apk updates/tv/cert3382/AnyTV-Connect-v2.1.apk updates/tv/current.json
          git diff --cached --quiet && { echo 'Expected new update binaries'; exit 1; }
          git commit -m 'release(anytv): compatible provider title links phone 2.9.4 TV 2.1 [skip ci]'
          git push origin HEAD:feat/tcl-v22-updates-back-bluetooth
          cmp signed/Controle_TCL_Livre_v2.9.4.apk updates/android/current.apk
          cmp signed/Controle_TCL_TV_v2.1_cert8b2b.apk updates/tv/cert8b2b/current.apk
          cmp signed/Controle_TCL_TV_v2.1_cert3382.apk updates/tv/cert3382/current.apk
      - name: Verify public updater URLs download the exact new bytes
        run: |
          set -euo pipefail
          root='https://raw.githubusercontent.com/brenoff2/tcl-apk-ci-builder/feat/tcl-v22-updates-back-bluetooth/updates'
          for entry in 'android/current.apk 87f382c98127c1792f41d60e0f0baef754c61b137e545ff03b067736ca9c005a' 'tv/cert8b2b/current.apk b16fe96c3b7a59137b26a89c0cebfbd7cb70e96524374b4f56d27edbcd61f720' 'tv/cert3382/current.apk 2ac44b84fafb5663d610cbee45815732cb4b196bac050bae3831caa0a2ab224f'; do
            read -r path expected <<< "$entry"
            ok=0
            for n in $(seq 1 12); do
              if curl -fLsS --max-time 90 "${root}/${path}?check=${GITHUB_RUN_ID}-${n}" -o public-current.apk &&
                 test "$(sha256sum public-current.apk | cut -d' ' -f1)" = "$expected"; then ok=1; break; fi
              sleep 4
            done
            test "$ok" = 1 || { echo "PUBLIC_CURRENT_WRONG: $path"; exit 1; }
          done
          echo 'ANYTV_294_21_BR_PRIME_ALL_CURRENT_PUBLIC_HASHES_VERIFIED'
