name: Verify official AnyTV cert2026 Android updater
on:
  push:
    branches: [feat/tcl-v22-updates-back-bluetooth]
    paths:
      - updates/android/cert2026/current.apk
      - '.github/workflows/*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tcl-v22-updates-back-bluetooth
      - name: Reject competing Android OTA publishing workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflows=Path('.github/workflows')
          matches={p.name for p in workflows.glob('*.yml')
                   if 'updates/android/cert2026/current.apk' in p.read_text(encoding='utf-8')}
          expected={'publish-anytv-phone-github-only.yml', 'verify-anytv-update-endpoint.yml'}
          if matches != expected:
              raise SystemExit('BLOCKED duplicate Android cert2026 OTA writers or missing canonical verifier: '+repr(sorted(matches)))
          old={p.name for p in workflows.glob('*.yml')
               if 'updates/android/current.apk' in p.read_text(encoding='utf-8')}
          if old:
              raise SystemExit('BLOCKED legacy Android publishing references: '+repr(sorted(old)))
          canonical=(workflows/'publish-anytv-phone-github-only.yml').read_text(encoding='utf-8')
          assert 'secrets.ANYTV_RECOVERY_SECRET_2026' in canonical
          assert canonical.count('secrets.') == 1
          print('ANYTV_SINGLE_ANDROID_PUBLISHER_VERIFIED')
          PY
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Validate official Android package and original signer
        shell: bash
        run: |
          set -euo pipefail
          FILE=updates/android/cert2026/current.apk
          test -s "$FILE"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging "$FILE" | grep -q "package: name='com.tclremote.livre'"
          "$BT/apksigner" verify --verbose --print-certs "$FILE" > cert-audit.txt
          grep -qx 'Verifies' cert-audit.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' cert-audit.txt
          grep -qi '2f14e43f7653a75f878c4d59a4a8ad462ade17c52bde23e802c8c6ed43ade95f' cert-audit.txt
          sha256sum "$FILE"
      - name: Remote byte-for-byte OTA readback
        shell: bash
        run: |
          set -euo pipefail
          FILE=updates/android/cert2026/current.apk
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL --retry 2 "https://raw.githubusercontent.com/brenoff2/tcl-apk-ci-builder/feat/tcl-v22-updates-back-bluetooth/updates/android/cert2026/current.apk?check=$attempt" -o published.apk || true
            if test -s published.apk && cmp -s published.apk "$FILE"; then
              echo 'ANYTV_CANONICAL_OTA_READBACK_OK'
              exit 0
            fi
            sleep 10
          done
          echo '::error::OTA mismatch'
          exit 1
