name: Verify official AnyTV cert2026 Android updater
on:
  push:
    branches: [feat/tcl-v22-updates-back-bluetooth]
    paths:
      - updates/android/cert2026/current.apk
      - .github/workflows/verify-anytv-update-endpoint.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tcl-v22-updates-back-bluetooth
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Validate official Android package and original signer
        shell: bash
        run: |
          set -euo pipefail
          FILE=updates/android/cert2026/current.apk
          test -s "$FILE"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging "$FILE" | grep -q "package: name='com.tclremote.livre'"
          "$BT/apksigner" verify --verbose --print-certs "$FILE" > cert-audit.txt
          grep -qx 'Verifies' cert-audit.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' cert-audit.txt
          grep -qi '2f14e43f7653a75f878c4d59a4a8ad462ade17c52bde23e802c8c6ed43ade95f' cert-audit.txt
          sha256sum "$FILE"
      - name: Remote byte-for-byte OTA readback
        shell: bash
        run: |
          set -euo pipefail
          FILE=updates/android/cert2026/current.apk
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL --retry 2 "https://raw.githubusercontent.com/brenoff2/tcl-apk-ci-builder/feat/tcl-v22-updates-back-bluetooth/updates/android/cert2026/current.apk?check=$attempt" -o published.apk || true
            if test -s published.apk && cmp -s published.apk "$FILE"; then
              echo 'ANYTV_CANONICAL_OTA_READBACK_OK'
              exit 0
            fi
            sleep 10
          done
          echo '::error::OTA mismatch'
          exit 1
