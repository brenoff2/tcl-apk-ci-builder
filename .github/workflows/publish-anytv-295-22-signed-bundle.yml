name: AnyTV 2.9.5 + Connect 2.2 - signed OTA release
on:
  push:
    branches: ['feat/tcl-v22-updates-back-bluetooth']
    paths: ['.github/workflows/publish-anytv-295-22-signed-bundle.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: anytv-signed-295-22-ota
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tcl-v22-updates-back-bluetooth
          fetch-depth: 0
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Create safe staging draft and detect the signed ZIP
        id: bundle
        run: |
          set -euo pipefail
          tag=anytv-signed-295-22-staging
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --latest=false \
              --target feat/tcl-v22-updates-back-bluetooth \
              --title 'AnyTV 2.9.5 / Connect 2.2 - signed APK staging' \
              --notes 'Stage only the ZIP AnyTV_Pessoal_2.9.5_Connect_2.2.zip; do not upload keystores, passwords, or private material.'
          fi
          mkdir -p stage
          if gh release download "$tag" -p AnyTV_Pessoal_2.9.5_Connect_2.2.zip -D stage 2>/dev/null \
             && test -s stage/AnyTV_Pessoal_2.9.5_Connect_2.2.zip; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'STAGING_WAITING_FOR_SIGNED_ZIP_NO_OTA_CHANGE'
          fi
      - name: Audit the exact original signed APKs
        if: steps.bundle.outputs.ready == 'true'
        run: |
          set -euo pipefail
          echo '06df0fa751fc7650f3bedf179209738ac073e7525de8561227e112931e74fc28  stage/AnyTV_Pessoal_2.9.5_Connect_2.2.zip' | sha256sum -c -
          mkdir signed
          unzip -j stage/AnyTV_Pessoal_2.9.5_Connect_2.2.zip \
            'AnyTV-v2.9.5.apk' 'AnyTV-Connect-v2.2-cert8b2b.apk' \
            'AnyTV-Connect-v2.2-cert3382.apk' -d signed
          echo 'bd284f3862307dab64cbbbea29b40c80bb68838fd89065127b138aa996489e04  signed/AnyTV-v2.9.5.apk' | sha256sum -c -
          echo 'bdc653d904c4bc0a022a71ccc81bec164887e5b85d14da3f1ab74bac32fec0e9  signed/AnyTV-Connect-v2.2-cert8b2b.apk' | sha256sum -c -
          echo 'c7a9d336dc131811531d14f06078d15ebcdb747f950b06efa30789597571a20f  signed/AnyTV-Connect-v2.2-cert3382.apk' | sha256sum -c -
          BT="$ANDROID_HOME/build-tools/36.0.0"
          for entry in \
            'AnyTV-v2.9.5.apk com.tclremote.livre 34 df72977485e8e5243048a7f1e8dff9fedcf2295161c4daae3834b6a16cd4e4c8' \
            'AnyTV-Connect-v2.2-cert8b2b.apk com.tclremote.tvcompanion 13 8b2b0c6f2a7a668f9aae829be811241dc70c3697af2b3e6c71e1a1767a5d83da' \
            'AnyTV-Connect-v2.2-cert3382.apk com.tclremote.tvcompanion 13 3382dfb12a0f16eb9167e056f947ea9740448fe07b8ef9d0ace0c889bf591add'; do
            read -r file pkg code cert <<< "$entry"
            "$BT/aapt" dump badging "signed/$file" | grep -q "name='$pkg' versionCode='$code'"
            "$BT/apksigner" verify --verbose --print-certs "signed/$file" > verified.txt
            grep -q '^Verifies$' verified.txt
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' verified.txt
            grep -qi "^Signer #1 certificate SHA-256 digest: $cert$" verified.txt
            "$BT/zipalign" -c 4 "signed/$file"
          done
          echo 'ALL_THREE_APKS_ORIGINAL_SIGNERS_VERIFIED'
      - name: Publish versioned releases
        if: steps.bundle.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ! gh release view tcl-phone-v2.9.5 >/dev/null 2>&1
          ! gh release view tv-complemento-v2.2 >/dev/null 2>&1
          gh release create tcl-phone-v2.9.5 signed/AnyTV-v2.9.5.apk \
            --target feat/tcl-v22-updates-back-bluetooth \
            --title 'AnyTV 2.9.5 - uso pessoal' \
            --notes 'Teste pessoal da fonte opcional Movie of the Night. Requer Connect 2.2. Preserva assinatura original.' --latest=false
          gh release create tv-complemento-v2.2 \
            signed/AnyTV-Connect-v2.2-cert8b2b.apk \
            signed/AnyTV-Connect-v2.2-cert3382.apk \
            --target feat/tcl-v22-updates-back-bluetooth \
            --title 'AnyTV Connect 2.2 - uso pessoal' \
            --notes 'Dois certificados permanentes preservados para atualizacao sobre versoes anteriores.' --latest=false
          mkdir -p fetched-phone fetched-tv
          gh release download tcl-phone-v2.9.5 -p '*.apk' -D fetched-phone
          gh release download tv-complemento-v2.2 -p '*.apk' -D fetched-tv
          cmp signed/AnyTV-v2.9.5.apk fetched-phone/AnyTV-v2.9.5.apk
          cmp signed/AnyTV-Connect-v2.2-cert8b2b.apk fetched-tv/AnyTV-Connect-v2.2-cert8b2b.apk
          cmp signed/AnyTV-Connect-v2.2-cert3382.apk fetched-tv/AnyTV-Connect-v2.2-cert3382.apk
      - name: Publish signed binaries in BOTH in-app update channels
        if: steps.bundle.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cp signed/AnyTV-v2.9.5.apk updates/android/current.apk
          cp signed/AnyTV-v2.9.5.apk updates/android/AnyTV-v2.9.5.apk
          cp signed/AnyTV-Connect-v2.2-cert8b2b.apk updates/tv/cert8b2b/current.apk
          cp signed/AnyTV-Connect-v2.2-cert8b2b.apk updates/tv/cert8b2b/AnyTV-Connect-v2.2.apk
          cp signed/AnyTV-Connect-v2.2-cert3382.apk updates/tv/cert3382/current.apk
          cp signed/AnyTV-Connect-v2.2-cert3382.apk updates/tv/cert3382/AnyTV-Connect-v2.2.apk
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = 'https://github.com/brenoff2/tcl-apk-ci-builder/releases/download/'
          updates = [
            ('android','com.tclremote.livre','2.9.5',34,'tcl-phone-v2.9.5',[
              ('AnyTV-v2.9.5.apk',28314468,'bd284f3862307dab64cbbbea29b40c80bb68838fd89065127b138aa996489e04')]),
            ('tv','com.tclremote.tvcompanion','2.2',13,'tv-complemento-v2.2',[
              ('AnyTV-Connect-v2.2-cert8b2b.apk',320191,'bdc653d904c4bc0a022a71ccc81bec164887e5b85d14da3f1ab74bac32fec0e9'),
              ('AnyTV-Connect-v2.2-cert3382.apk',320191,'c7a9d336dc131811531d14f06078d15ebcdb747f950b06efa30789597571a20f')])]
          for channel,pkg,version,code,tag,assets in updates:
            data={'schema':1,'platform':channel,'package':pkg,'available':True,
                  'version':version,'versionCode':code,'tag':tag,
                  'assets':[{'name':name,'size':size,'digest':'sha256:'+digest,
                             'browser_download_url':base+tag+'/'+name}
                            for name,size,digest in assets]}
            Path('updates',channel,'current.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f updates/android/current.apk updates/android/AnyTV-v2.9.5.apk \
            updates/android/current.json updates/tv/current.json \
            updates/tv/cert8b2b/current.apk updates/tv/cert8b2b/AnyTV-Connect-v2.2.apk \
            updates/tv/cert3382/current.apk updates/tv/cert3382/AnyTV-Connect-v2.2.apk
          git diff --cached --check
          git commit -m 'release(anytv): signed in-app phone 2.9.5 and TV 2.2 [skip ci]'
          git push origin HEAD:feat/tcl-v22-updates-back-bluetooth
          echo 'SIGNED_IN_APP_CHANNELS_COMMITTED'
      - name: Verify public updater paths match original signed hashes
        if: steps.bundle.outputs.ready == 'true'
        run: |
          set -euo pipefail
          root=https://raw.githubusercontent.com/brenoff2/tcl-apk-ci-builder/feat/tcl-v22-updates-back-bluetooth/updates
          for entry in \
            'android/current.apk bd284f3862307dab64cbbbea29b40c80bb68838fd89065127b138aa996489e04' \
            'tv/cert8b2b/current.apk bdc653d904c4bc0a022a71ccc81bec164887e5b85d14da3f1ab74bac32fec0e9' \
            'tv/cert3382/current.apk c7a9d336dc131811531d14f06078d15ebcdb747f950b06efa30789597571a20f'; do
            read -r file expected <<< "$entry"
            passed=0
            for n in $(seq 1 12); do
              if curl -fLsS --max-time 120 "$root/$file?check=$GITHUB_RUN_ID-$n" -o verify.apk \
                && test "$(sha256sum verify.apk | cut -d' ' -f1)" = "$expected"; then
                passed=1
                break
              fi
              sleep 4
            done
            test "$passed" = 1 || { echo "PUBLIC_CURRENT_HASH_MISMATCH $file"; exit 1; }
          done
          echo 'ANYTV_295_22_ALL_THREE_OTA_URLS_VERIFIED'
