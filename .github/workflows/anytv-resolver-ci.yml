name: AnyTV commercial resolver - offline contracts
on:
  push:
    branches: ['feat/tcl-v22-updates-back-bluetooth', 'feat/anytv-p0-device-proof-verifier-20261020']
    paths:
      - 'anytv-resolver/**'
      - '.github/workflows/anytv-resolver-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        run: node --check anytv-resolver/src/worker.mjs
      - name: Validate SQL migration using in-memory SQLite
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          db.executescript(Path('anytv-resolver/migrations/0001_create_tables.sql').read_text())
          db.execute('INSERT INTO link_cache(cache_key,payload,expires_at) VALUES (?,?,?)', ('test','{}',1750000000))
          assert db.execute('SELECT payload FROM link_cache WHERE cache_key=?',('test',)).fetchone() == ('{}',)
          print('SQLITE_CACHE_MIGRATION_OK')
          PY
      - name: Run security, provider and unrestricted-usage cache regression tests
        run: node --test anytv-resolver/src/worker.test.mjs
      - name: Cloudflare Worker bundle dry-run (no deployment, no token)
        run: |
          set -euo pipefail
          cd anytv-resolver
          npx --yes wrangler@4.45.0 deploy --dry-run --config wrangler.jsonc --outdir dist-dry-run
          test -f dist-dry-run/worker.js || test -f dist-dry-run/worker.mjs
      - name: Never deploy to production or use API secrets in CI
        run: echo 'OFFLINE_CONTRACTS_ONLY; no API key, app build or Cloudflare deployment.'
