name: Publish verified signed AnyTV 2.9.2 current
on:
  push:
    branches: ['feat/tcl-v22-updates-back-bluetooth']
    paths: ['.github/workflows/publish-anytv-292.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tcl-v22-updates-back-bluetooth
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Verify successful 2.9.2 build and prior signed update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/runs/38695036138 --jq .conclusion)" = success
          if gh release view tcl-phone-v2.9.2 >/dev/null 2>&1; then
            echo 'Release 2.9.2 already exists; refusing replacement'; exit 1
          fi
          echo 'beb9eb71098c0cb0a1101a35b1000339054a2d2a8f17f6ba787bf5e297700413  updates/android/current.apk' | sha256sum --check
          cmp updates/android/current.apk updates/android/AnyTV-v2.9.1.apk
      - name: Download and verify actual signed version 31 package
        shell: bash
        env:
          SIGNED_APK_SOURCE: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-b0d0-820e-82f5-8b41cf673d7f/raw?se=2026-10-15T07%3A08%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=1d1acc1b-1cb2-5078-a340-cd3aabef5349&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T03%3A59%3A59Z&ske=2026-10-16T03%3A59%3A59Z&sks=b&skv=2026-02-06&sig=WGT3T3MgHCLWteJPMb8E8uttYHpbf9dWQzvbzDvs%2BZs%3D'
        run: |
          set -euo pipefail
          mkdir -p output
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 240 "$SIGNED_APK_SOURCE" -o output/AnyTV-v2.9.2.apk
          echo 'f34510aebb686e88912b56eb6c2a6b655e5365b5d09c4e5ccb6dee97e5941e0d  output/AnyTV-v2.9.2.apk' | sha256sum --check
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/aapt" dump badging output/AnyTV-v2.9.2.apk | grep -q "name='com.tclremote.livre' versionCode='31' versionName='2.9.2-AnyTV'"
          "$bt/apksigner" verify --verbose --print-certs output/AnyTV-v2.9.2.apk > output/cert.txt
          grep -qi 'df72977485e8e5243048a7f1e8dff9fedcf2295161c4daae3834b6a16cd4e4c8' output/cert.txt
          "$bt/zipalign" -c 4 output/AnyTV-v2.9.2.apk
      - name: Write newest APK to REAL automatic update path
        shell: bash
        run: |
          set -euo pipefail
          cp output/AnyTV-v2.9.2.apk updates/android/AnyTV-v2.9.2.apk
          cp output/AnyTV-v2.9.2.apk updates/android/current.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f updates/android/current.apk updates/android/AnyTV-v2.9.2.apk
          git diff --cached --quiet && { echo 'No files updated'; exit 1; }
          git commit -m "release(android): signed AnyTV 2.9.2 becomes current [skip ci]"
          git push origin HEAD:feat/tcl-v22-updates-back-bluetooth
      - name: Publish official downloadable update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp output/AnyTV-v2.9.2.apk Controle_TCL_Livre_v2.9.2.apk
          gh release create tcl-phone-v2.9.2 Controle_TCL_Livre_v2.9.2.apk --target feat/tcl-v22-updates-back-bluetooth --title "AnyTV 2.9.2" --notes "Corrige a resposta visível do botão Abrir na TCL e o fallback do AnyTV Connect 1.6. Não garante deep link por título. Preserva certificados e controles existentes."
      - name: Final verify current and release identical
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/release
          gh release download tcl-phone-v2.9.2 -p Controle_TCL_Livre_v2.9.2.apk -D output/release
          echo 'f34510aebb686e88912b56eb6c2a6b655e5365b5d09c4e5ccb6dee97e5941e0d  output/release/Controle_TCL_Livre_v2.9.2.apk' | sha256sum --check
          echo 'f34510aebb686e88912b56eb6c2a6b655e5365b5d09c4e5ccb6dee97e5941e0d  updates/android/current.apk' | sha256sum --check
          cmp output/AnyTV-v2.9.2.apk updates/android/current.apk
          cmp output/AnyTV-v2.9.2.apk updates/android/AnyTV-v2.9.2.apk
          echo ANYTV_292_CURRENT_SIGNED_VERIFIED
